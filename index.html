<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1f36" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tabletop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
:root {
  --navy:#1a1f36; --navy-light:#252b47; --navy-mid:#2f3660;
  --amber:#e8a838; --amber-dim:#c4872a; --green:#4a9b6f; --red:#c44536;
  --text-on-dark:#f0ead6; --text-on-dark-muted:#9aa0b8;
  --radius-sm:8px; --radius-md:14px; --radius-lg:20px;
  --nav-height:72px; --safe-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
*:focus-visible{outline:none}
*{-webkit-tap-highlight-color:transparent}
html{font-size:16px;-webkit-text-size-adjust:100%}
body{font-family:'Inter',sans-serif;background:var(--navy);color:var(--text-on-dark);min-height:100dvh;overflow-x:hidden}
button{cursor:pointer;border:none;background:none;font-family:inherit}
input,select,textarea{font-family:inherit}
img{display:block;max-width:100%}
#app{max-width:480px;margin:0 auto;min-height:100dvh;position:relative}
.view{display:none;flex-direction:column;min-height:100dvh;padding-bottom:calc(var(--nav-height) + var(--safe-bottom) + 8px)}
.view.active{display:flex}

/* ── Nav ── */
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;height:calc(var(--nav-height) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--navy-light);border-top:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;justify-content:space-around;z-index:100}
.nav-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 10px;color:var(--text-on-dark-muted);transition:color 0.15s;font-size:10px;font-weight:500;letter-spacing:0.02em}
.nav-btn svg{width:22px;height:22px}
.nav-btn.active,.nav-btn:hover{color:var(--amber)}
.nav-btn--log{background:var(--amber);color:var(--navy)!important;border-radius:50%;width:52px;height:52px;padding:0;display:flex;align-items:center;justify-content:center;margin-top:-12px;box-shadow:0 4px 16px rgba(232,168,56,0.4)}
.nav-btn--log svg{width:26px;height:26px}
.nav-btn--log:hover{background:var(--amber-dim)}

/* ── Page header ── */
.page-header{padding:56px 20px 20px}
.page-header h1{font-family:'Playfair Display',serif;font-size:28px;font-weight:700;color:var(--text-on-dark);line-height:1.2}
.page-header p{font-size:13px;color:var(--text-on-dark-muted);margin-top:4px}
.section-label{font-size:11px;font-weight:600;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-on-dark-muted);padding:0 20px;margin-bottom:12px}

/* ── Stat pills ── */
.stat-row{display:flex;gap:8px;padding:0 20px;margin-bottom:24px;flex-wrap:wrap}
.stat-pill{flex:1;min-width:70px;background:var(--navy-light);border-radius:var(--radius-md);padding:12px 10px;text-align:center}
.stat-pill__value{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--amber);line-height:1}
.stat-pill__label{font-size:11px;color:var(--text-on-dark-muted);margin-top:4px}

/* ── Activity feed ── */
.activity-list{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.activity-item{background:var(--navy-light);border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background 0.15s}
.activity-item:hover{background:var(--navy-mid)}
.activity-item__cover{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--navy-mid);flex-shrink:0;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:22px}
.activity-item__cover img{width:100%;height:100%;object-fit:cover}
.activity-item__body{flex:1;min-width:0}
.activity-item__game{font-family:'Playfair Display',serif;font-size:15px;font-weight:600;color:var(--text-on-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.activity-item__detail{font-size:12px;color:var(--text-on-dark-muted);margin-top:2px}
.activity-item__winner{font-size:12px;color:var(--amber);font-weight:500;margin-top:2px}

/* ── Games grid ── */
.games-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px}
.game-card{border-radius:var(--radius-md);overflow:hidden;background:var(--navy-light);cursor:pointer;transition:transform 0.15s;position:relative}
.game-card:active{transform:scale(0.97)}
.game-card__cover{width:100%;aspect-ratio:1;background:var(--navy-mid);display:flex;align-items:center;justify-content:center;font-size:40px;overflow:hidden}
.game-card__cover img{width:100%;height:100%;object-fit:cover}
.game-card__info{padding:10px 12px 12px}
.game-card__title{font-family:'Playfair Display',serif;font-size:13px;font-weight:600;color:var(--text-on-dark);line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.game-card__meta{font-size:11px;color:var(--text-on-dark-muted);margin-top:2px}
.game-card__plays-badge{position:absolute;top:8px;right:8px;background:rgba(26,31,54,0.85);backdrop-filter:blur(4px);border-radius:20px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--amber)}
.game-card__rating{position:absolute;top:8px;left:8px;background:rgba(26,31,54,0.85);backdrop-filter:blur(4px);border-radius:20px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--amber)}
/* Wishlist badge — replaces plays badge for wishlist cards */
.game-card__wishlist-badge{position:absolute;top:8px;right:8px;background:rgba(26,31,54,0.85);backdrop-filter:blur(4px);border-radius:20px;padding:3px 8px;font-size:11px;font-weight:600;color:var(--text-on-dark-muted)}

/* ── Games toolbar (search + sort) ── */
.games-toolbar{display:flex;gap:8px;padding:0 20px 16px;align-items:center}
.games-search{flex:1;padding:9px 14px;background:var(--navy-light);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark);font-size:14px;outline:none;transition:border-color 0.15s}
.games-search:focus{border-color:var(--amber)}
.games-search::placeholder{color:var(--text-on-dark-muted)}
.sort-btn{padding:9px 12px;background:var(--navy-light);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark-muted);font-size:12px;font-weight:500;white-space:nowrap;transition:all 0.15s}
.sort-btn:hover,.sort-btn.active{border-color:var(--amber);color:var(--amber)}

/* ── Mechanic filter bar ── */
.mechanic-filter-bar{display:flex;gap:8px;padding:0 20px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mechanic-filter-bar::-webkit-scrollbar{display:none}
.mechanic-chip{padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);color:var(--text-on-dark-muted);font-size:12px;font-weight:500;white-space:nowrap;transition:all 0.15s;flex-shrink:0}
.mechanic-chip.active{background:rgba(232,168,56,0.15);border-color:var(--amber);color:var(--amber)}

/* ── Players ── */
.player-list{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.player-chip{background:var(--navy-light);border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background 0.15s}
.player-chip:hover{background:var(--navy-mid)}
.player-chip__avatar{width:44px;height:44px;border-radius:50%;background:var(--navy-mid);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;border:2px solid transparent}
.player-chip__avatar--admin{border-color:var(--amber)}
.player-chip__name{font-weight:600;font-size:15px;color:var(--text-on-dark)}
.player-chip__stats{font-size:12px;color:var(--text-on-dark-muted);margin-top:2px}
.player-chip__arrow{margin-left:auto;color:var(--text-on-dark-muted)}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:all 0.15s}
.btn--primary{background:var(--amber);color:var(--navy)}
.btn--primary:hover{background:var(--amber-dim)}
.btn--ghost{border:1px solid rgba(255,255,255,0.15);color:var(--text-on-dark)}
.btn--ghost:hover{background:var(--navy-light)}
.btn--full{width:100%}
.add-btn{display:flex;align-items:center;gap:10px;padding:14px 20px;background:var(--navy-light);border-radius:var(--radius-md);color:var(--text-on-dark-muted);font-size:14px;font-weight:500;width:calc(100% - 40px);margin:16px 20px 0;transition:background 0.15s}
.add-btn:hover{background:var(--navy-mid);color:var(--amber)}
.add-btn svg{width:20px;height:20px}

/* ── Discover tab toggle ── */
.discover-toggle{display:flex;gap:0;margin:0 20px 20px;background:var(--navy-mid);border-radius:var(--radius-sm);padding:4px}
.discover-tab{flex:1;padding:8px;border-radius:6px;font-size:13px;font-weight:600;color:var(--text-on-dark-muted);text-align:center;transition:all 0.15s}
.discover-tab.active{background:var(--navy-light);color:var(--amber)}

/* ── Tonight ── */
.tonight-filters{padding:0 20px;display:flex;flex-direction:column;gap:12px;margin-bottom:24px}
.filter-group label{font-size:12px;font-weight:500;color:var(--text-on-dark-muted);display:block;margin-bottom:6px}
.filter-group select{width:100%;padding:10px 14px;background:var(--navy-light);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark);font-size:14px;appearance:none}
.suggestion-card{margin:0 20px 12px;background:var(--navy-light);border-radius:var(--radius-md);overflow:hidden;display:flex;cursor:pointer;transition:background 0.15s}
.suggestion-card:hover{background:var(--navy-mid)}
.suggestion-card__cover{width:80px;flex-shrink:0;background:var(--navy-mid);display:flex;align-items:center;justify-content:center;font-size:32px;overflow:hidden}
.suggestion-card__cover img{width:100%;height:100%;object-fit:cover}
.suggestion-card__body{padding:14px 16px;flex:1}
.suggestion-card__title{font-family:'Playfair Display',serif;font-size:16px;font-weight:600;color:var(--text-on-dark)}
.suggestion-card__meta{font-size:12px;color:var(--text-on-dark-muted);margin-top:4px}
.suggestion-card__tag{display:inline-block;margin-top:8px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(232,168,56,0.15);color:var(--amber)}

/* ── Hot feed ── */
.hot-card{margin:0 20px 10px;background:var(--navy-light);border-radius:var(--radius-md);overflow:hidden;display:flex;align-items:center}
.hot-card__rank{width:40px;text-align:center;font-family:'Playfair Display',serif;font-size:15px;font-weight:700;color:var(--amber);flex-shrink:0}
.hot-card__cover{width:64px;height:64px;flex-shrink:0;background:var(--navy-mid);display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden}
.hot-card__cover img{width:100%;height:100%;object-fit:cover}
.hot-card__body{padding:12px 14px;flex:1;min-width:0}
.hot-card__title{font-family:'Playfair Display',serif;font-size:14px;font-weight:600;color:var(--text-on-dark);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hot-card__meta{font-size:12px;color:var(--text-on-dark-muted);margin-top:2px}
.hot-card__link{padding:0 16px;color:var(--amber);flex-shrink:0;font-size:18px;text-decoration:none;line-height:64px}

/* ── Modals ── */
.modal-overlay{position:fixed;inset:0;background:rgba(10,12,26,0.85);z-index:200;backdrop-filter:blur(3px)}
.modal-overlay.hidden{display:none}
/* Bottom sheet — for modals without primary text input (game detail, player detail, reset) */
.modal{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--navy-light);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:210;max-height:92dvh;overflow-y:auto;padding:24px 20px calc(32px + var(--safe-bottom))}
.modal.hidden{display:none}
/* Centered dialog — for input-heavy modals (add game, add player, log play, etc.)
   Anchored to viewport center so the keyboard sliding up underneath doesn't move it */
.modal--centered{bottom:auto;top:50%;transform:translate(-50%,-50%);border-radius:var(--radius-lg);max-height:85dvh;padding:24px 20px 28px}
.modal__handle{width:36px;height:4px;background:rgba(255,255,255,0.2);border-radius:2px;margin:0 auto 20px}
.modal__title{font-family:'Playfair Display',serif;font-size:22px;font-weight:700;color:var(--text-on-dark);margin-bottom:20px}
.modal__close{position:absolute;top:20px;right:20px;color:var(--text-on-dark-muted);padding:4px}
.modal__close svg{width:22px;height:22px}

/* ── Settings view ── */
.settings-item{background:var(--navy-light);border-radius:var(--radius-md);padding:16px 20px;margin:0 20px 10px;display:flex;align-items:center;gap:14px;cursor:pointer;transition:background 0.15s}
.settings-item:hover{background:var(--navy-mid)}
.settings-item__icon{font-size:22px;flex-shrink:0;width:36px;text-align:center}
.settings-item__body{flex:1}
.settings-item__label{font-size:15px;font-weight:600;color:var(--text-on-dark)}
.settings-item__desc{font-size:12px;color:var(--text-on-dark-muted);margin-top:2px}
.settings-item__arrow{color:var(--text-on-dark-muted)}
.settings-token-input{width:100%;padding:12px 14px;background:var(--navy-mid);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark);font-size:13px;font-family:monospace;outline:none;transition:border-color 0.15s;margin-top:8px}
.settings-token-input:focus{border-color:var(--amber)}

/* ── Description collapsible ── */
.description-text{font-size:13px;color:var(--text-on-dark-muted);line-height:1.7;margin-bottom:8px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3}
.description-text.expanded{display:block}
.description-toggle{font-size:12px;color:var(--amber);font-weight:600;padding:0;margin-bottom:20px}

/* ── Mechanic pills ── */
.mechanic-pills{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.mechanic-pill{padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600;background:rgba(232,168,56,0.1);color:var(--amber);border:1px solid rgba(232,168,56,0.2)}

/* ── Forms ── */
.form-group{margin-bottom:16px}
.form-group label{display:block;font-size:12px;font-weight:600;color:var(--text-on-dark-muted);margin-bottom:6px;letter-spacing:0.05em;text-transform:uppercase}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:12px 14px;background:var(--navy-mid);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark);font-size:15px;outline:none;transition:border-color 0.15s}
.form-group input:focus,.form-group select:focus{border-color:var(--amber)}
.form-group input::placeholder{color:var(--text-on-dark-muted)}
.form-group select{appearance:none}
.bgg-results{background:var(--navy-mid);border-radius:var(--radius-sm);overflow:hidden;margin-top:4px}
.bgg-result-item{display:flex;align-items:center;gap:12px;padding:10px 14px;cursor:pointer;border-bottom:1px solid rgba(255,255,255,0.06);transition:background 0.1s}
.bgg-result-item:last-child{border-bottom:none}
.bgg-result-item:hover{background:rgba(255,255,255,0.05)}
.bgg-result-item__name{font-size:14px;font-weight:500;color:var(--text-on-dark)}
.bgg-result-item__year{font-size:12px;color:var(--text-on-dark-muted)}

/* ── Player toggles ── */
.player-select-grid{display:flex;flex-wrap:wrap;gap:8px}
.player-toggle{padding:8px 14px;border-radius:20px;border:1px solid rgba(255,255,255,0.15);color:var(--text-on-dark-muted);font-size:13px;font-weight:500;transition:all 0.15s;display:flex;align-items:center;gap:6px}
.player-toggle.selected{background:rgba(232,168,56,0.15);border-color:var(--amber);color:var(--amber)}

/* ── Achievements ── */
.achievement-list{display:flex;flex-direction:column;gap:10px;padding:0 20px}
.achievement-item{background:var(--navy-light);border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:14px}
.achievement-item__icon{width:44px;height:44px;border-radius:50%;background:var(--navy-mid);display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.achievement-item--earned .achievement-item__icon{background:rgba(232,168,56,0.15)}
.achievement-item__title{font-weight:600;font-size:14px;color:var(--text-on-dark)}
.achievement-item--locked .achievement-item__title{color:var(--text-on-dark-muted)}
.achievement-item__desc{font-size:12px;color:var(--text-on-dark-muted);margin-top:2px}

/* ── Win rate bars ── */
.win-rate-bar{margin-bottom:12px}
.win-rate-bar__header{display:flex;justify-content:space-between;font-size:13px;color:var(--text-on-dark);margin-bottom:6px}
.win-rate-bar__pct{font-weight:600;color:var(--amber)}
.win-rate-bar__track{height:6px;background:var(--navy-mid);border-radius:3px;overflow:hidden}
.win-rate-bar__fill{height:100%;background:var(--amber);border-radius:3px;transition:width 0.6s ease}

/* ── Complexity dots ── */
.complexity-dots{display:flex;gap:3px}
.complexity-dot{width:8px;height:8px;border-radius:50%;background:var(--navy-mid)}
.complexity-dot.filled{background:var(--amber)}

/* ── Empty state ── */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:48px 20px;text-align:center;gap:12px}
.empty-state__icon{font-size:48px}
.empty-state__title{font-family:'Playfair Display',serif;font-size:20px;font-weight:600;color:var(--text-on-dark)}
.empty-state__body{font-size:14px;color:var(--text-on-dark-muted);line-height:1.6}

/* ── Action pill (fixed above nav) ── */
.action-pill{position:fixed;bottom:calc(var(--nav-height) + var(--safe-bottom) + 12px);left:50%;transform:translateX(-50%);width:calc(100% - 80px);max-width:360px;background:var(--amber);color:var(--navy);font-size:14px;font-weight:700;text-align:center;padding:14px 20px;border-radius:50px;cursor:pointer;z-index:99;box-shadow:0 4px 20px rgba(232,168,56,0.45);transition:background 0.15s,transform 0.15s;user-select:none}
.action-pill:hover{background:var(--amber-dim)}
.action-pill:active{transform:translateX(-50%) scale(0.97)}
.action-pill.hidden{display:none}

/* ── Sort dropdown ── */
.sort-dropdown{position:absolute;top:100%;right:20px;margin-top:4px;background:var(--navy-mid);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);overflow:hidden;z-index:50;min-width:180px}
.sort-option{padding:10px 16px;font-size:13px;color:var(--text-on-dark);cursor:pointer;transition:background 0.1s}
.sort-option:hover{background:rgba(255,255,255,0.06)}
.sort-option.active{color:var(--amber)}

/* ── BGG credit ── */
.bgg-credit{display:flex;align-items:center;justify-content:center;gap:6px;padding:20px;font-size:11px;color:var(--text-on-dark-muted)}
.bgg-credit a{color:var(--text-on-dark-muted);text-decoration:none;font-weight:600}
.bgg-credit a:hover{color:var(--amber)}
</style>
</head>
<body>
<div id="app">
  <div id="view-home" class="view active"></div>
  <div id="view-games" class="view"></div>
  <div id="view-players" class="view"></div>
  <div id="view-tonight" class="view"></div>
  <div id="view-discover" class="view"></div>
  <div id="view-settings" class="view"></div>

  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="modal-game-detail" class="modal hidden"></div>
  <div id="modal-player-detail" class="modal hidden"></div>
  <div id="modal-add-game" class="modal modal--centered hidden"></div>
  <div id="modal-add-player" class="modal modal--centered hidden"></div>
  <div id="modal-log-play" class="modal modal--centered hidden"></div>
  <div id="modal-edit-session" class="modal modal--centered hidden"></div>
  <div id="modal-add-wishlist" class="modal modal--centered hidden"></div>

  <div id="modal-reset" class="modal hidden">
    <div class="modal__handle"></div>
    <div style="text-align:center;padding:8px 0 24px">
      <div style="font-size:48px;margin-bottom:16px">⚠️</div>
      <div class="modal__title" style="text-align:center">Reset all data?</div>
      <p style="font-size:14px;color:var(--text-on-dark-muted);line-height:1.6;margin-bottom:28px">This will permanently delete all games, players, sessions, and achievements. There is no undo.</p>
      <button class="btn btn--full" style="background:var(--red);color:#fff;margin-bottom:10px" onclick="confirmReset()">Yes, delete everything</button>
      <button class="btn btn--ghost btn--full" onclick="closeModal('modal-reset')">Cancel</button>
    </div>
  </div>

  <!-- Fixed action pills — only visible on their respective tabs -->
  <div id="pill-add-game" class="action-pill hidden" onclick="openAddGame()">+ Add a game</div>
  <div id="pill-add-player" class="action-pill hidden" onclick="openAddPlayer()">+ Add a new player</div>
  <div id="pill-add-wishlist" class="action-pill hidden" onclick="openAddWishlist()">+ Add to wishlist</div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span>Home</span>
    </button>

      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Games</span>
    </button>
    <button class="nav-btn nav-btn--log" id="btn-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>

      <span>Players</span>

      <span>Discover</span>
    </button>
  </nav>
</div>

<script>
// ─────────────────────────────────────────────────────────
// BGG TOKEN — replace with your token from boardgamegeek.com/applications
// ─────────────────────────────────────────────────────────
const BGG_TOKEN = 'PASTE_YOUR_TOKEN_HERE';
const BGG_BASE  = 'https://boardgamegeek.com/xmlapi2';

async function bggFetch(url) {
  const res = await fetch(url, { headers: { 'Authorization': `Bearer ${BGG_TOKEN}` } });
  if (!res.ok) throw new Error(`BGG ${res.status}`);
  return res.text();
}

// ─────────────────────────────────────────────────────────
// DATA LAYER
// All reads/writes go through db. Swap Firebase later = rewrite only this object.
// ─────────────────────────────────────────────────────────
const KEYS = { GAMES:'tt_games', PLAYERS:'tt_players', SESSIONS:'tt_sessions', ACHIEVEMENTS:'tt_achievements' };
function load(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function save(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
function uuid() { return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2)+Date.now().toString(36); }

const db = {
  // ── Games ──
  // wishlist:true games are excluded from session logging, Tonight, and stats.
  // They live in the same store as owned games — one flag separates them.
  // This means BGG data (cover, mechanics, etc.) is pre-populated when you buy it.
  getGames()       { return load(KEYS.GAMES); },
  getOwnedGames()  { return this.getGames().filter(g => !g.wishlist); },
  getWishlist()    { return this.getGames().filter(g => g.wishlist); },
  getGame(id)      { return this.getGames().find(g => g.id === id) || null; },
  addGame(game)    {
    const games = this.getGames();
    // Auto-remove from wishlist if same bggId exists there.
    // We check bggId (not title) because titles can differ slightly between editions.
    // Manual games without a bggId are never auto-removed — user deletes manually.
    if (game.bggId) {
      const wishlistMatch = games.find(g => g.wishlist && g.bggId === game.bggId);
      if (wishlistMatch) { this.deleteGame(wishlistMatch.id); return this.addGame(game); }
    }
    const n = { ...game, id: uuid(), addedAt: new Date().toISOString() };
    const fresh = this.getGames(); fresh.push(n); save(KEYS.GAMES, fresh); return n;
  },
  updateGame(id, changes) { save(KEYS.GAMES, this.getGames().map(g => g.id===id ? {...g,...changes} : g)); },
  deleteGame(id)   { save(KEYS.GAMES, this.getGames().filter(g => g.id!==id)); save(KEYS.SESSIONS, this.getSessions().filter(s => s.gameId!==id)); },

  // ── Players ──
  getPlayers()       { return load(KEYS.PLAYERS); },
  getPlayer(id)      { return this.getPlayers().find(p => p.id===id) || null; },
  addPlayer(player)  { const players=this.getPlayers(); const n={...player,id:uuid(),addedAt:new Date().toISOString()}; players.push(n); save(KEYS.PLAYERS,players); return n; },
  updatePlayer(id,changes) { save(KEYS.PLAYERS, this.getPlayers().map(p => p.id===id ? {...p,...changes} : p)); },
  deletePlayer(id)   { save(KEYS.PLAYERS, this.getPlayers().filter(p => p.id!==id)); },

  // ── Sessions ──
  getSessions()             { return load(KEYS.SESSIONS); },
  getSessionsForGame(gid)   { return this.getSessions().filter(s => s.gameId===gid); },
  getSessionsForPlayer(pid) { return this.getSessions().filter(s => s.players.includes(pid)); },
  addSession(session) {
    const sessions = this.getSessions();
    const n = { ...session, id: uuid(), loggedAt: new Date().toISOString() };
    sessions.push(n); save(KEYS.SESSIONS, sessions); return n;
  },
  updateSession(id, changes) { save(KEYS.SESSIONS, this.getSessions().map(s => s.id===id ? {...s,...changes} : s)); },
  deleteSession(id)  { save(KEYS.SESSIONS, this.getSessions().filter(s => s.id!==id)); },

  // ── Achievements ──
  getAchievements()    { return load(KEYS.ACHIEVEMENTS); },
  saveAchievements(a)  { save(KEYS.ACHIEVEMENTS, a); },

  // ── Derived stats ──
  getWinRate(playerId, gameId=null) {
    let sessions = this.getSessionsForPlayer(playerId);
    if (gameId) sessions = sessions.filter(s => s.gameId===gameId);
    if (!sessions.length) return null;
    const wins = sessions.filter(s => s.winners.includes(playerId)).length;
    return { wins, plays:sessions.length, rate:Math.round((wins/sessions.length)*100) };
  },
  getGameHealth(gameId) {
    const sessions = this.getSessionsForGame(gameId);
    if (!sessions.length) return { plays:0, lastPlayed:null };
    const sorted = [...sessions].sort((a,b) => new Date(b.date)-new Date(a.date));
    return { plays:sessions.length, lastPlayed:sorted[0].date };
  },
  getRecentSessions(limit=10) {
    return [...this.getSessions()].sort((a,b) => new Date(b.date)-new Date(a.date)).slice(0,limit);
  },
  // Most played game — returns the owned game with the most sessions, or null
  getMostPlayed() {
    const games = this.getOwnedGames();
    if (!games.length) return null;
    const withPlays = games.map(g => ({ ...g, plays: this.getSessionsForGame(g.id).length }));
    const top = withPlays.sort((a,b) => b.plays-a.plays)[0];
    return top.plays > 0 ? top : null;
  },
  // Tonight: all filters optional — missing/default values include everything
  getGamesForTonight(playerCount, maxComplexity, maxPlayTime, mechanic) {
    return this.getOwnedGames().filter(g => {
      const countOk   = g.minPlayers<=playerCount && g.maxPlayers>=playerCount;
      const complexOk = maxComplexity==='any' || g.complexity<=parseFloat(maxComplexity);
      const timeOk    = maxPlayTime==='any' || !g.maxPlayTime || g.maxPlayTime<=parseInt(maxPlayTime);
      const mechOk    = !mechanic || (g.mechanics||[]).includes(mechanic);
      return countOk && complexOk && timeOk && mechOk;
    });
  },
  // All unique mechanics across owned games only (wishlist excluded — you can't play them yet)
  getAllMechanics() {
    return [...new Set(this.getOwnedGames().flatMap(g => g.mechanics||[]))].sort();
  },
};

// ─────────────────────────────────────────────────────────
// BGG API
// ─────────────────────────────────────────────────────────
const bgg = {
  async search(query) {
    try {
      const text = await bggFetch(`${BGG_BASE}/search?query=${encodeURIComponent(query)}&type=boardgame`);
      const xml  = new DOMParser().parseFromString(text,'text/xml');
      const results = [...xml.querySelectorAll('item')].slice(0,40).map(item => ({
        bggId: item.getAttribute('id'),
        title: item.querySelector('name[type="primary"]')?.getAttribute('value')||'Unknown',
        year:  item.querySelector('yearpublished')?.getAttribute('value')||'',
      }));
      // Re-sort by name match quality: exact > starts-with > contains > other
      const q = query.toLowerCase().trim();
      results.sort((a,b) => {
        const score = n => n===q?0:n.startsWith(q)?1:n.includes(q)?2:3;
        return score(a.title.toLowerCase()) - score(b.title.toLowerCase());
      });
      return results.slice(0,8);
    } catch(e) { console.error('BGG search',e); return []; }
  },

  async getGame(bggId) {
    try {
      const text = await bggFetch(`${BGG_BASE}/thing?id=${bggId}&stats=1`);
      const xml  = new DOMParser().parseFromString(text,'text/xml');
      const item = xml.querySelector('item'); if(!item) return null;
      const rawDesc = item.querySelector('description')?.textContent||'';
      const desc    = new DOMParser().parseFromString(rawDesc,'text/html').body.textContent||'';
      const mechanics  = [...item.querySelectorAll('link[type="boardgamemechanic"]')].map(l=>l.getAttribute('value')).filter(Boolean);
      const expansions = [...item.querySelectorAll('link[type="boardgameexpansion"]')].map(l=>({id:l.getAttribute('id'),bggId:l.getAttribute('id'),title:l.getAttribute('value'),owned:false,rating:'unknown'}));
      const rating = parseFloat(item.querySelector('statistics ratings average')?.getAttribute('value'));
      return {
        bggId,
        title:       item.querySelector('name[type="primary"]')?.getAttribute('value')||'Unknown',
        year:        item.querySelector('yearpublished')?.getAttribute('value')||'',
        thumbUrl:    item.querySelector('thumbnail')?.textContent?.trim()||'',
        coverUrl:    item.querySelector('image')?.textContent?.trim()||'',
        minPlayers:  parseInt(item.querySelector('minplayers')?.getAttribute('value'))||1,
        maxPlayers:  parseInt(item.querySelector('maxplayers')?.getAttribute('value'))||4,
        minPlayTime: parseInt(item.querySelector('minplaytime')?.getAttribute('value'))||null,
        maxPlayTime: parseInt(item.querySelector('maxplaytime')?.getAttribute('value'))||null,
        complexity:  Math.round((parseFloat(item.querySelector('averageweight')?.getAttribute('value'))||2.5)*10)/10,
        rating:      isNaN(rating)?null:Math.round(rating*10)/10,
        description: desc, mechanics, expansions,
      };
    } catch(e) { console.error('BGG getGame',e); return null; }
  },

  async getHot() {
    try {
      const text = await bggFetch(`${BGG_BASE}/hot?type=boardgame`);
      const xml  = new DOMParser().parseFromString(text,'text/xml');
      return [...xml.querySelectorAll('item')].slice(0,30).map(item=>({
        bggId:    item.getAttribute('id'),
        rank:     item.getAttribute('rank'),
        title:    item.querySelector('name')?.getAttribute('value')||'Unknown',
        year:     item.querySelector('yearpublished')?.getAttribute('value')||'',
        thumbUrl: item.querySelector('thumbnail')?.getAttribute('value')||'',
      }));
    } catch(e) { console.error('BGG hot',e); return []; }
  },
};

// ─────────────────────────────────────────────────────────
// ACHIEVEMENTS
// ─────────────────────────────────────────────────────────
const ACHIEVEMENT_DEFS = [
  { id:'FIRST_BLOOD',  title:'First Blood',       desc:'Win your very first game',              icon:'🏆', check:(pid,s)=>s.filter(x=>x.winners.includes(pid)).length>=1 },
  { id:'VETERAN',      title:'Veteran',            desc:'Play the same game 10 times',           icon:'🎖️', check:(pid,s)=>{ const c={}; s.filter(x=>x.players.includes(pid)).forEach(x=>{c[x.gameId]=(c[x.gameId]||0)+1;}); return Object.values(c).some(v=>v>=10); }},
  { id:'SOCIAL',       title:'Social Butterfly',   desc:'Play with 5 different players',         icon:'🦋', check:(pid,s)=>{ const o=new Set(); s.filter(x=>x.players.includes(pid)).forEach(x=>x.players.forEach(p=>{if(p!==pid)o.add(p);})); return o.size>=5; }},
  { id:'COLLECTOR',    title:'Collector',           desc:'Play 10 different games',               icon:'📦', check:(pid,s)=>new Set(s.filter(x=>x.players.includes(pid)).map(x=>x.gameId)).size>=10 },
  { id:'UNLUCKY',      title:'Unlucky Streak',     desc:'Play 10 sessions without a single win', icon:'😬', check:(pid,s)=>{ const m=s.filter(x=>x.players.includes(pid)); return m.length>=10&&m.filter(x=>x.winners.includes(pid)).length===0; }},
  { id:'DOMINATOR',    title:'Dominator',           desc:'Win 5 sessions in a row',               icon:'👑', check:(pid,s)=>{ const m=[...s.filter(x=>x.players.includes(pid))].sort((a,b)=>new Date(a.date)-new Date(b.date)); let str=0; for(const x of m){if(x.winners.includes(pid)){str++;if(str>=5)return true;}else str=0;} return false; }},
  { id:'COOP_CHAMP',   title:'Co-op Champion',     desc:'Win 5 co-op sessions',                  icon:'🤝', check:(pid,s)=>s.filter(x=>x.isCoop&&x.players.includes(pid)&&x.winners.includes(pid)).length>=5 },
  { id:'MARATHON',     title:'Marathon',            desc:'Play a session lasting over 3 hours',   icon:'⏱️', check:(pid,s)=>s.some(x=>x.players.includes(pid)&&x.durationMinutes>=180) },
];

const achievements = {
  getForPlayer(playerId) {
    const earned = new Set(db.getAchievements().filter(a=>a.playerId===playerId).map(a=>a.type));
    return ACHIEVEMENT_DEFS.map(def => ({ ...def, earned:earned.has(def.id), earnedAt:db.getAchievements().find(a=>a.playerId===playerId&&a.type===def.id)?.earnedAt||null }));
  },
  recalculate() {
    const sessions=db.getSessions(); const existing=db.getAchievements(); const newOnes=[];
    for (const player of db.getPlayers()) {
      for (const def of ACHIEVEMENT_DEFS) {
        if (!existing.some(a=>a.playerId===player.id&&a.type===def.id) && def.check(player.id,sessions))
          newOnes.push({ id:uuid(), playerId:player.id, type:def.id, earnedAt:new Date().toISOString() });
      }
    }
    if (newOnes.length) db.saveAchievements([...existing,...newOnes]);
    return newOnes;
  },
};

// ─────────────────────────────────────────────────────────
// HELPERS
// ─────────────────────────────────────────────────────────

// haptic: a small vibration on save actions to make the app feel native.
// navigator.vibrate is not available on iOS (Safari policy) but works on Android.
// We wrap it in a try/catch so failure is silent — it's enhancement-only.
function haptic(ms=40) { try { navigator.vibrate?.(ms); } catch {} }

function complexityLabel(c) { if(c<=1.5)return'Light'; if(c<=2.5)return'Medium-light'; if(c<=3.5)return'Medium'; if(c<=4.5)return'Heavy'; return'Expert'; }
function complexityDots(c) { return Array.from({length:5},(_,i)=>`<div class="complexity-dot ${i<Math.round(c)?'filled':''}"></div>`).join(''); }
function coverHTML(game,size='thumb') {
  const url=size==='full'?game.coverUrl:game.thumbUrl;
  return url?`<img src="${url}" alt="${game.title}" />`:`<span style="font-size:${size==='full'?'64':'36'}px">${game.coverEmoji||'🎲'}</span>`;
}
function formatDate(iso) {
  const d=new Date(iso); const diff=Math.floor((Date.now()-d)/86400000);
  if(diff===0)return'Today'; if(diff===1)return'Yesterday'; if(diff<7)return`${diff} days ago`;
  return d.toLocaleDateString('sv-SE',{month:'short',day:'numeric'});
}
function playTimeLabel(min,max) { if(!min&&!max)return null; if(!min||min===max)return`${max}m`; return`${min}–${max}m`; }

function confirmReset() {
  Object.values(KEYS).forEach(key=>localStorage.removeItem(key));
  hotCache=null; discoverSection='wishlist';
  closeAllModals(); location.reload();
}

// ─────────────────────────────────────────────────────────
// VIEW STATE
// Module-level variables survive navigation. This is how we persist
// filter/sort state without localStorage — it lives in JS memory for the session.
// ─────────────────────────────────────────────────────────
let gamesFilter  = null;   // active mechanic chip
let gamesSearch  = '';     // search input value
let gamesSort    = 'added'; // 'added' | 'name' | 'plays' | 'rating'
let sortOpen     = false;  // sort dropdown visibility
let gamesSection = 'games'; // 'games' | 'tonight' — which sub-view is active

// Tonight filters — persisted as an object so all four survive tab switching
const tonightFilters = { players:'2', complexity:'any', playtime:'any', mechanic:'' };

let discoverSection = 'wishlist'; // 'wishlist' | 'hot'
let hotCache = null;

// ─────────────────────────────────────────────────────────
// VIEWS
// ─────────────────────────────────────────────────────────
function renderHome() {
  const el=document.getElementById('view-home');
  const sessions=db.getRecentSessions(8);
  const games=db.getOwnedGames();
  const players=db.getPlayers();
  const mostPlayed=db.getMostPlayed();

  const recentHTML=sessions.length?sessions.map(s=>{
    const game=games.find(g=>g.id===s.gameId); if(!game)return'';
    const winnerNames=s.winners.map(wid=>{const p=players.find(pl=>pl.id===wid);return p?`${p.avatar} ${p.name}`:''}).filter(Boolean).join(', ');
    const result=s.isCoop?(s.winners.length?'🤝 Co-op win!':'💀 Co-op loss'):(winnerNames?`🏆 ${winnerNames}`:'No winner logged');
    return `<div class="activity-item" onclick="openGameDetail('${s.gameId}')">
      <div class="activity-item__cover">${coverHTML(game)}</div>
      <div class="activity-item__body">
        <div class="activity-item__game">${game.title}</div>
        <div class="activity-item__detail">${formatDate(s.date)} · ${s.players.length} players</div>
        <div class="activity-item__winner">${result}</div>
      </div></div>`;
  }).join(''):`<div class="empty-state"><div class="empty-state__icon">🎲</div><div class="empty-state__title">No sessions yet</div><div class="empty-state__body">Log your first play with the + button below.</div></div>`;

  const mostPlayedHTML=mostPlayed?`
    <div class="section-label" style="margin-top:24px">Most played</div>
    <div class="activity-list" style="margin-bottom:8px">
      <div class="activity-item" onclick="openGameDetail('${mostPlayed.id}')">
        <div class="activity-item__cover">${coverHTML(mostPlayed)}</div>
        <div class="activity-item__body">
          <div class="activity-item__game">${mostPlayed.title}</div>
          <div class="activity-item__detail">${mostPlayed.plays} session${mostPlayed.plays!==1?'s':''}</div>
        </div>
      </div>
    </div>`:'';

  el.innerHTML=`
    <div class="page-header" style="position:relative">
      <h1>Tabletop</h1>
      <p>Your board game stats at a glance</p>
      <button onclick="navigateTo('settings')" style="position:absolute;top:52px;right:16px;color:var(--text-on-dark-muted);padding:4px" title="Settings">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
      </button>
    </div>
    <div class="stat-row">
      <div class="stat-pill"><div class="stat-pill__value">${games.length}</div><div class="stat-pill__label">Games</div></div>
      <div class="stat-pill"><div class="stat-pill__value">${db.getSessions().length}</div><div class="stat-pill__label">Sessions</div></div>
      <div class="stat-pill"><div class="stat-pill__value">${players.length}</div><div class="stat-pill__label">Players</div></div>
    </div>
    ${mostPlayedHTML}
    <div class="section-label" style="margin-top:${mostPlayed?'24px':'0'}">Recent sessions</div>
    <div class="activity-list">${recentHTML}</div>`;
}

function renderGames() {
  const el=document.getElementById('view-games');

  // Toggle bar — same pattern as Discover's Wishlist/Hot toggle.
  // gamesSection persists across re-renders so switching to Tonight and back keeps your place.
  const toggleHTML=`
    <div class="discover-toggle" style="margin:0 20px 20px">
      <button class="discover-tab ${gamesSection==='games'?'active':''}" onclick="gamesSection='games';sortOpen=false;renderGames()">🎲 My Games</button>
      <button class="discover-tab ${gamesSection==='tonight'?'active':''}" onclick="gamesSection='tonight';renderGames()">⭐ Tonight</button>
    </div>`;

  // When Tonight is selected, we render its content inside the Games view.
  // renderTonight() writes to #view-tonight, so we can't call it directly —
  // instead we inline the Tonight content generation here.
  if(gamesSection==='tonight') {
    // Hide the add-game pill — Tonight doesn't need it
    document.getElementById('pill-add-game').classList.add('hidden');
    el.innerHTML=`
      <div class="page-header"><h1>Games</h1><p>Find the right game for tonight</p></div>
      ${toggleHTML}`;
    // Append tonight content into the Games view
    renderTonightInto(el);
    return;
  }

  // ── My Games section ────────────────────────────────────
  // Restore the pill when back on My Games
  document.getElementById('pill-add-game').classList.remove('hidden');

  const allOwned=db.getOwnedGames();
  const mechanics=db.getAllMechanics();
  let games=gamesFilter?allOwned.filter(g=>(g.mechanics||[]).includes(gamesFilter)):allOwned;
  if(gamesSearch.trim()){const q=gamesSearch.trim().toLowerCase();games=games.filter(g=>g.title.toLowerCase().includes(q));}

  const sorted=[...games];
  if(gamesSort==='name')   sorted.sort((a,b)=>a.title.localeCompare(b.title));
  if(gamesSort==='plays')  sorted.sort((a,b)=>db.getGameHealth(b.id).plays-db.getGameHealth(a.id).plays);
  if(gamesSort==='rating') sorted.sort((a,b)=>(b.rating||0)-(a.rating||0));

  const SORT_LABELS={ added:'Date added', name:'Name', plays:'Most played', rating:'BGG rating' };

  const mechanicBar=mechanics.length?`
    <div class="mechanic-filter-bar">
      <button class="mechanic-chip ${!gamesFilter?'active':''}" onclick="gamesFilter=null;renderGames()">All</button>

          ${Array.from({length:Math.min(maxP,10)},(_,i)=>i+1).map(n=>`<option value="${n}" ${tonightFilters.players==n?'selected':''}>${n} player${n!==1?'s':''}</option>`).join('')}
        </select>
      </div>
      <div class="filter-group">
        <label>Complexity</label>
        <select id="filter-complexity" onchange="tonightFilters.complexity=this.value;filterTonight()">
          <option value="any" ${tonightFilters.complexity==='any'?'selected':''}>Any complexity</option>
          <option value="2" ${tonightFilters.complexity==='2'?'selected':''}>Light (1–2)</option>
          <option value="3" ${tonightFilters.complexity==='3'?'selected':''}>Medium (up to 3)</option>
          <option value="4" ${tonightFilters.complexity==='4'?'selected':''}>Heavy (up to 4)</option>
          <option value="5" ${tonightFilters.complexity==='5'?'selected':''}>Expert (any)</option>
        </select>
      </div>
      <div class="filter-group">
        <label>Play time</label>
        <select id="filter-playtime" onchange="tonightFilters.playtime=this.value;filterTonight()">
          <option value="any" ${tonightFilters.playtime==='any'?'selected':''}>Any length</option>
          <option value="30" ${tonightFilters.playtime==='30'?'selected':''}>Under 30 min</option>
          <option value="60" ${tonightFilters.playtime==='60'?'selected':''}>Under 1 hour</option>
          <option value="90" ${tonightFilters.playtime==='90'?'selected':''}>Under 90 min</option>
          <option value="120" ${tonightFilters.playtime==='120'?'selected':''}>Under 2 hours</option>
        </select>
      </div>
      ${mechanics.length?`<div class="filter-group">
        <label>Mechanic</label>
        <select id="filter-mechanic" onchange="tonightFilters.mechanic=this.value;filterTonight()">
          <option value="" ${!tonightFilters.mechanic?'selected':''}>Any mechanic</option>
          ${mechanics.map(m=>`<option value="${m}" ${tonightFilters.mechanic===m?'selected':''}>${m}</option>`).join('')}
        </select>
      </div>`:''}

  container.insertAdjacentHTML('beforeend', filtersHTML);
  filterTonight();
}

function renderTonight() {
  const el=document.getElementById('view-tonight');
  el.innerHTML=`<div class="page-header"><h1>Tonight</h1><p>Find the right game for the evening</p></div>`;
  renderTonightInto(el);
}

function filterTonight() {
  const {players:pc,complexity:cx,playtime:pt,mechanic:mc}=tonightFilters;
  const games=db.getGamesForTonight(parseInt(pc),cx,pt,mc);
  const container=document.getElementById('tonight-results');
  if(!container)return;

  if(!games.length) {
    // Specific empty state: tell the user exactly which filter is causing the miss
    const owned=db.getOwnedGames();
    let reason='No games match your filters.';
    if(!owned.length) reason='Add some games to your collection first.';
    else if(!db.getGamesForTonight(parseInt(pc),'any','any','').length)
      reason=`None of your games support ${pc} players.`;
    else if(!db.getGamesForTonight(parseInt(pc),cx,'any','').length)
      reason='No games match that player count and complexity combination.';
    else if(pt!=='any'&&!db.getGamesForTonight(parseInt(pc),cx,pt,'').length)
      reason='No games fit within that play time. Try a longer time limit.';
    else if(mc&&!db.getGamesForTonight(parseInt(pc),cx,pt,'').find(g=>(g.mechanics||[]).includes(mc)))
      reason=`No games with "${mc}" match the other filters.`;
    container.innerHTML=`<div class="empty-state"><div class="empty-state__icon">🤔</div><div class="empty-state__title">No matches</div><div class="empty-state__body">${reason}</div></div>`;
    return;
  }

  const withHealth=games.map(g=>({...g,health:db.getGameHealth(g.id)}));
  withHealth.sort((a,b)=>{
    if(!a.health.lastPlayed&&!b.health.lastPlayed)return 0;
    if(!a.health.lastPlayed)return-1; if(!b.health.lastPlayed)return 1;
    return new Date(a.health.lastPlayed)-new Date(b.health.lastPlayed);
  });
  container.innerHTML=withHealth.map(g=>{
    const tag=!g.health.lastPlayed?'Never played':`Last played ${new Date(g.health.lastPlayed).toLocaleDateString('sv-SE',{month:'short',day:'numeric'})}`;
    const time=playTimeLabel(g.minPlayTime,g.maxPlayTime);
    return`<div class="suggestion-card" onclick="openGameDetail('${g.id}')">
      <div class="suggestion-card__cover">${coverHTML(g)}</div>
      <div class="suggestion-card__body">
        <div class="suggestion-card__title">${g.title}</div>
        <div class="suggestion-card__meta">${g.minPlayers}–${g.maxPlayers} players${time?` · ${time}`:''}  · ${complexityLabel(g.complexity)}</div>
        <div class="suggestion-card__tag">${tag}</div>
      </div></div>`;
  }).join('');
}

function openGameDetail(gameId) {
  const game=db.getGame(gameId); if(!game)return;
  const sessions=db.getSessionsForGame(gameId);
  const players=db.getPlayers(); const health=db.getGameHealth(gameId);
  const modal=document.getElementById('modal-game-detail');

  const playerStats=players.filter(p=>sessions.some(s=>s.players.includes(p.id)))
    .map(p=>({...p,wr:db.getWinRate(p.id,gameId)})).sort((a,b)=>(b.wr?.rate||0)-(a.wr?.rate||0));

  const winRatesHTML=playerStats.length?playerStats.map(p=>`
    <div class="win-rate-bar">
      <div class="win-rate-bar__header"><span>${p.avatar} ${p.name}</span>
        <span class="win-rate-bar__pct">${p.wr.rate}% <span style="color:var(--text-on-dark-muted);font-weight:400">(${p.wr.wins}/${p.wr.plays})</span></span></div>
      <div class="win-rate-bar__track"><div class="win-rate-bar__fill" style="width:${p.wr.rate}%"></div></div>
    </div>`).join(''):`<p style="font-size:13px;color:var(--text-on-dark-muted)">No sessions logged yet.</p>`;

  const recentSessions=[...sessions].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,10);
  const sessionsHTML=recentSessions.map(s=>{
    const winnerNames=s.winners.map(wid=>{const p=players.find(pl=>pl.id===wid);return p?`${p.avatar} ${p.name}`:''}).filter(Boolean).join(', ');
    const result=s.isCoop?(s.winners.length?'🤝 Co-op win':'💀 Co-op loss'):(winnerNames||'No winner');
    const expsUsed=(s.expansionsUsed||[]).map(eid=>game.expansions?.find(e=>e.id===eid)?.title).filter(Boolean).join(', ');
    return`<div style="padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.07);display:flex;align-items:flex-start;gap:10px">
      <div style="flex:1">
        <div style="font-size:12px;color:var(--text-on-dark-muted)">${new Date(s.date).toLocaleDateString('sv-SE',{year:'numeric',month:'short',day:'numeric'})} · ${s.players.length} players</div>
        <div style="font-size:12px;color:var(--amber);font-weight:500;margin-top:2px">${result}</div>
        ${expsUsed?`<div style="font-size:11px;color:var(--text-on-dark-muted);margin-top:2px">📦 ${expsUsed}</div>`:''}
        ${s.notes?`<div style="font-size:11px;color:var(--text-on-dark-muted);margin-top:2px;font-style:italic">${s.notes}</div>`:''}
      </div>
      <div style="display:flex;gap:6px;flex-shrink:0">
        <button onclick="openEditSession('${s.id}','${gameId}')" style="font-size:11px;color:var(--text-on-dark-muted);padding:4px 8px;border:1px solid rgba(255,255,255,0.1);border-radius:4px">Edit</button>
        <button onclick="if(confirm('Delete this session?')){db.deleteSession('${s.id}');achievements.recalculate();closeModal('modal-game-detail');renderAll();openGameDetail('${gameId}')}" style="font-size:11px;color:var(--red);padding:4px 8px;border:1px solid rgba(196,69,54,0.3);border-radius:4px">Del</button>
      </div>
    </div>`;
  }).join('');

  const expRatingBadge=r=>{const map={must_have:'⭐ Must have',good:'👍 Good to have',skip:'🤷 Can skip',unknown:''};const text=map[r]||'';return text?`<span style="font-size:11px;font-weight:600;color:var(--amber);background:rgba(232,168,56,0.12);padding:2px 8px;border-radius:20px;white-space:nowrap">${text}</span>`:''};

  const expansionsHTML=game.expansions?.length?game.expansions.map(e=>`
    <div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(255,255,255,0.07)">
      <span style="font-size:18px">${e.owned?'✅':'❌'}</span>
      <span style="font-size:14px;color:var(--text-on-dark);flex:1">${e.title}</span>
      ${expRatingBadge(e.rating)}
      ${e.bggId?`<a href="https://boardgamegeek.com/boardgameexpansion/${e.bggId}" target="_blank" rel="noopener" style="color:var(--amber);text-decoration:none;font-size:16px" onclick="event.stopPropagation()">↗</a>`:''}
    </div>`).join(''):`<p style="font-size:13px;color:var(--text-on-dark-muted)">No expansions tracked.</p>`;

  const fullCover=game.coverUrl?`<img src="${game.coverUrl}" alt="${game.title}" style="width:100%;height:180px;object-fit:cover;border-radius:var(--radius-md);margin-bottom:20px" />`:`<div style="font-size:64px;text-align:center;padding:24px 0">${game.coverEmoji||'🎲'}</div>`;
  const descHTML=game.description?`<p class="description-text" id="game-desc-text">${game.description}</p><button class="description-toggle" onclick="toggleDesc()">Read more</button>`:'';
  const mechanicsHTML=game.mechanics?.length?`<div class="mechanic-pills">${game.mechanics.map(m=>`<span class="mechanic-pill">${m}</span>`).join('')}</div>`:'';
  const pt=playTimeLabel(game.minPlayTime,game.maxPlayTime);

    `<div class="stat-pill"><div class="stat-pill__value">${health.plays}</div><div class="stat-pill__label">Plays</div></div>`,
    `<div class="stat-pill"><div class="stat-pill__value">${game.minPlayers}–${game.maxPlayers}</div><div class="stat-pill__label">Players</div></div>`,
    `<div class="stat-pill"><div class="stat-pill__value">${game.complexity}</div><div class="stat-pill__label">${complexityLabel(game.complexity)}</div></div>`,
    pt?`<div class="stat-pill"><div class="stat-pill__value" style="font-size:16px">${pt}</div><div class="stat-pill__label">Play time</div></div>`:'',
    game.rating?`<div class="stat-pill"><div class="stat-pill__value">★ ${game.rating}</div><div class="stat-pill__label">BGG rating</div></div>`:'',
  ].filter(Boolean).join('');

  // Wishlist indicator
  const wishlistNote=game.wishlist?`<div style="background:rgba(232,168,56,0.1);border:1px solid rgba(232,168,56,0.3);border-radius:var(--radius-sm);padding:10px 14px;margin-bottom:16px;font-size:13px;color:var(--amber)">🎯 On your wishlist — add it to My Games when you buy it.</div>`:'';

  modal.innerHTML=`
    <div class="modal__handle"></div>
    <button class="modal__close" onclick="closeModal('modal-game-detail')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>

    ${wishlistNote}

    ${mechanicsHTML}
    <div class="stat-row" style="padding:0;margin-bottom:20px">${statPills}</div>
    ${health.lastPlayed?`<p style="font-size:12px;color:var(--text-on-dark-muted);margin-bottom:20px">Last played ${new Date(health.lastPlayed).toLocaleDateString('sv-SE',{year:'numeric',month:'short',day:'numeric'})}</p>`:''}
    ${!game.wishlist?`
      <div class="section-label" style="padding:0;margin-bottom:12px">Win rates</div>
      <div style="margin-bottom:24px">${winRatesHTML}</div>
      ${recentSessions.length?`<div class="section-label" style="padding:0;margin-bottom:12px">Sessions</div><div style="margin-bottom:24px">${sessionsHTML}</div>`:''}
    `:''}
    <div class="section-label" style="padding:0;margin-bottom:12px">Expansions</div>
    <div style="margin-bottom:24px">${expansionsHTML}</div>
    ${game.bggId?`<a href="https://boardgamegeek.com/boardgame/${game.bggId}" target="_blank" rel="noopener" style="display:block;text-align:center;color:var(--amber);font-size:13px;font-weight:600;margin-bottom:16px;text-decoration:none">View on BoardGameGeek ↗</a>`:''}
    ${!game.wishlist?`<button class="btn btn--primary btn--full" onclick="closeModal('modal-game-detail');openLogPlay('${gameId}')">Log a session</button>`:''}

    </div>`;
  openModal('modal-game-detail');
}

let bggSearchTimeout=null, selectedBggGame=null, expansionCount=0, editingGameId=null;

function openAddGame(gameId=null) {

      <div class="form-group">

function onBggSearch(query) {
  clearTimeout(bggSearchTimeout);
  if(query.length<2){document.getElementById('bgg-search-results').style.display='none';return;}
  bggSearchTimeout=setTimeout(async()=>{
    const results=await bgg.search(query);
    const container=document.getElementById('bgg-search-results');
    if(!results.length){container.style.display='none';return;}
    container.innerHTML=results.map(r=>`
      <div class="bgg-result-item" onclick="selectBggGame('${r.bggId}','${r.title.replace(/'/g,"\\'")}','${r.year}')">
        <div><div class="bgg-result-item__name">${r.title}</div><div class="bgg-result-item__year">${r.year}</div></div>
      </div>`).join('');
    container.style.display='block';
  },400);
}

async function selectBggGame(bggId,title,year) {
  document.getElementById('bgg-search-results').style.display='none';
  document.getElementById('bgg-search-input').value=title;
  const preview=document.getElementById('selected-game-preview');
  document.getElementById('selected-game-name').textContent=title;
  document.getElementById('selected-game-meta').textContent='Fetching details from BGG…';
  preview.style.display='block';
  const data=await bgg.getGame(bggId);
  if(data){
    selectedBggGame=data;
    document.getElementById('manual-game-title').value=data.title;
    document.getElementById('game-min-players').value=data.minPlayers;
    document.getElementById('game-max-players').value=data.maxPlayers;
    document.getElementById('game-complexity').value=data.complexity;
    document.getElementById('selected-game-meta').textContent=`${data.minPlayers}–${data.maxPlayers} players · Complexity ${data.complexity} · ${year}${data.rating?` · ★ ${data.rating}`:''}`;
    document.getElementById('expansion-list').innerHTML=''; expansionCount=0;
    data.expansions.forEach(e=>addExpansionField(e.title,false,'unknown',null,e.bggId));
  } else {
    document.getElementById('selected-game-meta').textContent='Could not fetch details — fill in manually.';
  }
}

const EXP_RATINGS=[{value:'unknown',label:'❓ Not sure'},{value:'must_have',label:'⭐ Must have'},{value:'good',label:'👍 Good to have'},{value:'skip',label:'🤷 Can skip'}];

function addExpansionField(title='',owned=false,rating='unknown',expansionId=null,bggId=null) {
  const id=++expansionCount; const list=document.getElementById('expansion-list');
  const div=document.createElement('div');
  div.style.cssText='display:grid;grid-template-columns:1fr auto;gap:8px;margin-bottom:12px;align-items:center';
  div.dataset.expansionId=expansionId||''; div.dataset.bggId=bggId||'';
  div.innerHTML=`
    <input type="text" placeholder="Expansion name" id="exp-title-${id}" value="${title}" style="padding:10px 14px;background:var(--navy-mid);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark);font-size:14px;outline:none;width:100%" />
    <button style="color:var(--red);font-size:18px;padding:4px 6px">×</button>
    <div style="display:flex;gap:8px;align-items:center">
      <select id="exp-rating-${id}" style="padding:8px 10px;background:var(--navy-mid);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark);font-size:12px;outline:none;appearance:none">
        ${EXP_RATINGS.map(r=>`<option value="${r.value}" ${r.value===rating?'selected':''}>${r.label}</option>`).join('')}
      </select>
      <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-on-dark-muted);white-space:nowrap"><input type="checkbox" id="exp-owned-${id}" ${owned?'checked':''} /> Owned</label>
    </div>`;
  div.querySelector('button').onclick=()=>div.remove();
  list.appendChild(div);
}

function saveGame() {
  const title=document.getElementById('manual-game-title')?.value?.trim()||selectedBggGame?.title;
  if(!title){alert('Please enter a game title.');return;}
  const expansions=[];
  document.querySelectorAll('#expansion-list > div').forEach(row=>{
    const input=row.querySelector('[id^="exp-title-"]'); const checkbox=row.querySelector('[id^="exp-owned-"]'); const ratingEl=row.querySelector('[id^="exp-rating-"]');
    const expTitle=input?.value?.trim();
    if(expTitle) expansions.push({id:row.dataset.expansionId||uuid(),bggId:row.dataset.bggId||null,title:expTitle,owned:checkbox?.checked??false,rating:ratingEl?.value||'unknown'});
  });
  const gameData={title,minPlayers:parseInt(document.getElementById('game-min-players').value)||2,maxPlayers:parseInt(document.getElementById('game-max-players').value)||4,complexity:parseFloat(document.getElementById('game-complexity').value)||2.5,isCoop:document.getElementById('game-coop').value==='true',coverEmoji:document.getElementById('game-emoji').value||'🎲',expansions};
  if(editingGameId){db.updateGame(editingGameId,gameData);}
  else{db.addGame({...gameData,bggId:selectedBggGame?.bggId||null,coverUrl:selectedBggGame?.coverUrl||'',thumbUrl:selectedBggGame?.thumbUrl||'',year:selectedBggGame?.year||'',rating:selectedBggGame?.rating||null,minPlayTime:selectedBggGame?.minPlayTime||null,maxPlayTime:selectedBggGame?.maxPlayTime||null,mechanics:selectedBggGame?.mechanics||[],description:selectedBggGame?.description||''});}
  haptic(); editingGameId=null; closeModal('modal-add-game'); renderAll();
}

let logSelectedPlayers=new Set(), logSelectedWinners=new Set(), logSelectedExpansions=new Set();

function openLogPlay(preselectedGameId=null) {
  logSelectedPlayers=new Set(); logSelectedWinners=new Set(); logSelectedExpansions=new Set();
  const games=db.getOwnedGames(); const players=db.getPlayers();
  if(!games.length){alert('Add a game first before logging a session.');return;}
  if(!players.length){alert('Add some players first before logging a session.');return;}
  const modal=document.getElementById('modal-log-play');
  const today=new Date().toISOString().split('T')[0];

  modal.innerHTML=`
    <div class="modal__handle"></div>
    <button class="modal__close" onclick="closeModal('modal-log-play')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal__title">Log a session</div>
    <div class="form-group">
      <label>Game</label>
      <select id="log-game" onchange="logSelectedExpansions=new Set();renderWinnerPicker();renderExpansionPicker()">
        ${games.map(g=>`<option value="${g.id}" ${g.id===preselectedGameId?'selected':''}>${g.title}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Date</label><input type="date" id="log-date" value="${today}" /></div>
    <div class="form-group">
      <label>Who played?</label>
      <div class="player-select-grid" id="log-players">
        ${players.map(p=>`<button type="button" class="player-toggle" id="log-player-${p.id}" onclick="toggleLogPlayer('${p.id}')">${p.avatar} ${p.name}</button>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label id="log-winner-label">Who won?</label>
      <div class="player-select-grid" id="log-winners"><span style="font-size:13px;color:var(--text-on-dark-muted)">Select players above first</span></div>
    </div>
    <div class="form-group" id="log-expansions-group" style="display:none">
      <label>Expansions used</label>
      <div class="player-select-grid" id="log-expansions"></div>
    </div>
    <div class="form-group"><label>Notes (optional)</label><input type="text" id="log-notes" placeholder="e.g. Used the promo card, first play" /></div>
    <button class="btn btn--primary btn--full" onclick="saveSession()">Save session</button>`;

  // Render expansion picker for the pre-selected game
  renderExpansionPicker();
  openModal('modal-log-play');
}

function renderExpansionPicker() {
  const gameId=document.getElementById('log-game')?.value;
  const game=db.getGame(gameId);
  const ownedExpansions=(game?.expansions||[]).filter(e=>e.owned);
  const group=document.getElementById('log-expansions-group');
  const container=document.getElementById('log-expansions');
  if(!group||!container)return;
  if(!ownedExpansions.length){group.style.display='none';return;}
  group.style.display='block';
  container.innerHTML=ownedExpansions.map(e=>`
    <button type="button" class="player-toggle ${logSelectedExpansions.has(e.id)?'selected':''}" onclick="toggleLogExpansion('${e.id}')">${e.title}</button>`).join('');
}

function toggleLogExpansion(expId) {
  if(logSelectedExpansions.has(expId)) logSelectedExpansions.delete(expId);
  else logSelectedExpansions.add(expId);
  renderExpansionPicker();
}

function toggleLogPlayer(playerId) {
  const btn=document.getElementById(`log-player-${playerId}`);
  if(logSelectedPlayers.has(playerId)){logSelectedPlayers.delete(playerId);logSelectedWinners.delete(playerId);btn?.classList.remove('selected');}
  else{logSelectedPlayers.add(playerId);btn?.classList.add('selected');}
  renderWinnerPicker();
}
function toggleLogWinner(playerId) {
  const game=db.getGame(document.getElementById('log-game')?.value);
  if(!game?.isCoop){logSelectedWinners.clear();logSelectedWinners.add(playerId);}
  else{if(logSelectedWinners.has(playerId))logSelectedWinners.delete(playerId);else logSelectedWinners.add(playerId);}
  renderWinnerPicker();
}
function renderWinnerPicker() {
  const container=document.getElementById('log-winners'); const label=document.getElementById('log-winner-label');
  const game=db.getGame(document.getElementById('log-game')?.value); const isCoop=game?.isCoop||false;
  if(!container)return;
  if(!logSelectedPlayers.size){container.innerHTML='<span style="font-size:13px;color:var(--text-on-dark-muted)">Select players above first</span>';return;}
  if(label)label.textContent=isCoop?'Did everyone win?':'Who won?';
  const players=db.getPlayers().filter(p=>logSelectedPlayers.has(p.id));
  container.innerHTML=players.map(p=>`<button type="button" class="player-toggle ${logSelectedWinners.has(p.id)?'selected':''}" onclick="toggleLogWinner('${p.id}')">${p.avatar} ${p.name}</button>`).join('');
  if(isCoop)container.innerHTML+=`<button type="button" class="player-toggle ${logSelectedWinners.size===0?'selected':''}" onclick="logSelectedWinners.clear();renderWinnerPicker()">💀 Loss</button>`;
}

function saveSession() {
  const gameId=document.getElementById('log-game')?.value;
  const date=document.getElementById('log-date')?.value;
  const notes=document.getElementById('log-notes')?.value?.trim()||'';
  const game=db.getGame(gameId);
  if(!gameId||!date){alert('Please select a game and date.');return;}
  if(!logSelectedPlayers.size){alert('Select at least one player.');return;}
  db.addSession({gameId,date,isCoop:game?.isCoop||false,players:[...logSelectedPlayers],winners:[...logSelectedWinners],expansionsUsed:[...logSelectedExpansions],notes});
  achievements.recalculate(); haptic(60);
  closeModal('modal-log-play'); renderAll();
}

// ─────────────────────────────────────────────────────────
// EDIT SESSION MODAL
// Pre-fills from the existing session. Saves via updateSession().
// Expansions used, winner, players, notes and date are all editable.
// Duration is intentionally excluded — we removed it from the data model.
// ─────────────────────────────────────────────────────────
let editSessionId=null, editSessionGameId=null;
let editSelectedWinners=new Set(), editSelectedExpansions=new Set();

function openEditSession(sessionId, gameId) {
  const session=db.getSessions().find(s=>s.id===sessionId); if(!session)return;
  const game=db.getGame(gameId); if(!game)return;
  editSessionId=sessionId; editSessionGameId=gameId;
  editSelectedWinners=new Set(session.winners);
  editSelectedExpansions=new Set(session.expansionsUsed||[]);

  const modal=document.getElementById('modal-edit-session');
  const players=db.getPlayers();
  const ownedExpansions=(game.expansions||[]).filter(e=>e.owned);

  modal.innerHTML=`
    <div class="modal__handle"></div>
    <button class="modal__close" onclick="closeModal('modal-edit-session')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal__title">Edit session</div>
    <p style="font-size:13px;color:var(--text-on-dark-muted);margin-bottom:20px">${game.title}</p>
    <div class="form-group"><label>Date</label><input type="date" id="edit-date" value="${session.date}" /></div>
    <div class="form-group">
      <label>${game.isCoop?'Did everyone win?':'Who won?'}</label>
      <div class="player-select-grid" id="edit-winners">
        ${players.filter(p=>session.players.includes(p.id)).map(p=>`
          <button type="button" class="player-toggle ${editSelectedWinners.has(p.id)?'selected':''}" id="edit-winner-${p.id}" onclick="toggleEditWinner('${p.id}','${game.isCoop}')">${p.avatar} ${p.name}</button>`).join('')}
        ${game.isCoop?`<button type="button" class="player-toggle ${editSelectedWinners.size===0?'selected':''}" onclick="editSelectedWinners.clear();renderEditWinners('${game.isCoop}','${gameId}','${sessionId}')">💀 Loss</button>`:''}
      </div>
    </div>
    ${ownedExpansions.length?`<div class="form-group">
      <label>Expansions used</label>
      <div class="player-select-grid">
        ${ownedExpansions.map(e=>`<button type="button" class="player-toggle ${editSelectedExpansions.has(e.id)?'selected':''}" id="edit-exp-${e.id}" onclick="toggleEditExpansion('${e.id}')">${e.title}</button>`).join('')}
      </div>
    </div>`:''}
    <div class="form-group"><label>Notes (optional)</label><input type="text" id="edit-notes" value="${session.notes||''}" placeholder="e.g. Used promo card" /></div>
    <button class="btn btn--primary btn--full" onclick="saveEditSession()">Save changes</button>`;

  openModal('modal-edit-session');
}

function toggleEditWinner(playerId, isCoop) {
  if(isCoop==='true'||isCoop===true){
    if(editSelectedWinners.has(playerId)) editSelectedWinners.delete(playerId); else editSelectedWinners.add(playerId);
  } else { editSelectedWinners.clear(); editSelectedWinners.add(playerId); }
  // Update button states directly (no full re-render needed)
  document.querySelectorAll('[id^="edit-winner-"]').forEach(btn=>{
    const pid=btn.id.replace('edit-winner-','');
    btn.classList.toggle('selected',editSelectedWinners.has(pid));
  });
}

function toggleEditExpansion(expId) {
  if(editSelectedExpansions.has(expId)) editSelectedExpansions.delete(expId); else editSelectedExpansions.add(expId);
  const btn=document.getElementById(`edit-exp-${expId}`);
  if(btn) btn.classList.toggle('selected',editSelectedExpansions.has(expId));
}

function saveEditSession() {
  const date=document.getElementById('edit-date')?.value; if(!date)return;
  const notes=document.getElementById('edit-notes')?.value?.trim()||'';
  db.updateSession(editSessionId,{date,winners:[...editSelectedWinners],expansionsUsed:[...editSelectedExpansions],notes});
  achievements.recalculate(); haptic();
  closeModal('modal-edit-session');
  // Re-open the game detail so the user can see the updated session immediately
  openGameDetail(editSessionGameId);
}

        </button>

        Data is stored locally on this device.<br/>
        Game data powered by <a href="https://boardgamegeek.com" target="_blank" rel="noopener" style="color:var(--amber)">BoardGameGeek</a>.
      </div>
    </div>`;
}

function navigateTo(viewName) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.remove('active'));
  const view=document.getElementById(`view-${viewName}`);
  const btn=document.querySelector(`.nav-btn[data-view="${viewName}"]`);
  if(view)view.classList.add('active'); if(btn)btn.classList.add('active');

  // Pills — hide all, then show the right one for this tab
  document.getElementById('pill-add-game').classList.toggle('hidden', viewName!=='games' || gamesSection!=='games');
  document.getElementById('pill-add-player').classList.toggle('hidden', viewName!=='players');
  document.getElementById('pill-add-wishlist').classList.toggle('hidden', viewName!=='discover'||discoverSection!=='wishlist');

  const renderers={home:renderHome,games:renderGames,players:renderPlayers,discover:renderDiscover,settings:renderSettings};
  renderers[viewName]?.();
  window.scrollTo(0,0);
}

// Close sort dropdown when clicking outside it
document.addEventListener('click',e=>{
  if(sortOpen&&!e.target.closest('.sort-btn')&&!e.target.closest('.sort-dropdown')){
    sortOpen=false; renderGames();
  }
});

function renderAll(){renderCurrent();}
function renderCurrent(){
  const active=document.querySelector('.view.active'); if(!active)return;
  const name=active.id.replace('view-','');
  const renderers={home:renderHome,games:renderGames,players:renderPlayers};
  renderers[name]?.();
}
function openModal(id){document.getElementById('modal-overlay').classList.remove('hidden');document.getElementById(id).classList.remove('hidden');document.body.style.overflow='hidden';}
function closeModal(id){
  document.getElementById(id).classList.add('hidden');
  const anyOpen=[...document.querySelectorAll('.modal')].some(m=>!m.classList.contains('hidden'));
  if(!anyOpen){document.getElementById('modal-overlay').classList.add('hidden');document.body.style.overflow='';}
}
function closeAllModals(){
  document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden'));
  document.getElementById('modal-overlay').classList.add('hidden');document.body.style.overflow='';
}

// ─────────────────────────────────────────────────────────
// BOOT
// ─────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded',()=>{
  document.querySelectorAll('.nav-btn[data-view]').forEach(btn=>btn.addEventListener('click',()=>navigateTo(btn.dataset.view)));
  document.getElementById('btn-log').addEventListener('click',openLogPlay);
  document.getElementById('modal-overlay').addEventListener('click',closeAllModals);
  navigateTo('home');
  if(!db.getPlayers().length&&!db.getGames().length) seedDemoData();

  // Scroll focused inputs into view after keyboard opens.
  // 300ms delay lets the keyboard animation finish first.
  // block:'nearest' scrolls the minimum needed — avoids overshooting
  // and hiding the label above the input.
  document.addEventListener('focusin', e => {
    if (e.target.matches('input, select, textarea')) {
      setTimeout(() => e.target.scrollIntoView({ behavior:'smooth', block:'nearest' }), 300);
    }
  });
});
