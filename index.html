<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1f36" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tabletop</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app">
    <div id="view-home" class="view active"></div>
    <div id="view-games" class="view"></div>
    <div id="view-log" class="view"></div>
    <div id="view-players" class="view"></div>
    <div id="view-tonight" class="view"></div>

    <!-- Modals -->
    <div id="modal-overlay" class="modal-overlay hidden"></div>
    <div id="modal-game-detail" class="modal hidden"></div>
    <div id="modal-player-detail" class="modal hidden"></div>
    <div id="modal-add-game" class="modal hidden"></div>
    <div id="modal-add-player" class="modal hidden"></div>
    <div id="modal-log-play" class="modal hidden"></div>

    <nav class="bottom-nav">
      <button class="nav-btn active" data-view="home">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
        <span>Home</span>
      </button>
      <button class="nav-btn" data-view="games">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
        <span>Games</span>
      </button>
      <button class="nav-btn nav-btn--log" data-view="log">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
      </button>
      <button class="nav-btn" data-view="players">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
        <span>Players</span>
      </button>
      <button class="nav-btn" data-view="tonight">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
        <span>Tonight</span>
      </button>
    </nav>
  </div>

  <script src="js/db.js"></script>
  <script src="js/bgg.js"></script>
  <script src="js/achievements.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/games.js"></script>
  <script src="js/views/log.js"></script>
  <script src="js/views/players.js"></script>
  <script src="js/views/tonight.js"></script>
  <script src="js/modals/game-detail.js"></script>
  <script src="js/modals/player-detail.js"></script>
  <script src="js/modals/add-game.js"></script>
  <script src="js/modals/add-player.js"></script>
  <script src="js/modals/log-play.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
