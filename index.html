<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1f36" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Tabletop</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
/* ── Tokens ─────────────────────────────────────────────── */
:root {
  --navy:    #1a1f36;
  --navy-light: #252b47;
  --navy-mid: #2f3660;
  --card:    #f0ead6;
  --card-dark: #e4dcc4;
  --amber:   #e8a838;
  --amber-dim: #c4872a;
  --green:   #4a9b6f;
  --red:     #c44536;
  --text-primary: #1a1f36;
  --text-secondary: #5a6070;
  --text-muted: #8a93a8;
  --text-on-dark: #f0ead6;
  --text-on-dark-muted: #9aa0b8;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --nav-height: 72px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { font-size: 16px; -webkit-text-size-adjust: 100%; }
body {
  font-family: 'Inter', sans-serif;
  background: var(--navy);
  color: var(--text-on-dark);
  min-height: 100dvh;
  overflow-x: hidden;
}
button { cursor: pointer; border: none; background: none; font-family: inherit; }
input, select, textarea { font-family: inherit; }
img { display: block; max-width: 100%; }

#app {
  max-width: 480px;
  margin: 0 auto;
  min-height: 100dvh;
  position: relative;
}

.view {
  display: none;
  flex-direction: column;
  min-height: 100dvh;
  padding-bottom: calc(var(--nav-height) + var(--safe-bottom) + 8px);
}
.view.active { display: flex; }

/* ── Bottom nav ─────────────────────────────────────────── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  height: calc(var(--nav-height) + var(--safe-bottom));
  padding-bottom: var(--safe-bottom);
  background: var(--navy-light);
  border-top: 1px solid rgba(255,255,255,0.08);
  display: flex;
  align-items: center;
  justify-content: space-around;
  z-index: 100;
}
.nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  padding: 8px 16px;
  color: var(--text-on-dark-muted);
  transition: color 0.15s;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.02em;
}
.nav-btn svg { width: 22px; height: 22px; }
.nav-btn.active, .nav-btn:hover { color: var(--amber); }
.nav-btn--log {
  background: var(--amber);
  color: var(--navy) !important;
  border-radius: 50%;
  width: 52px;
  height: 52px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  margin-top: -12px;
  box-shadow: 0 4px 16px rgba(232,168,56,0.4);
}
.nav-btn--log svg { width: 26px; height: 26px; }
.nav-btn--log:hover { background: var(--amber-dim); }

/* ── Page header ────────────────────────────────────────── */
.page-header {
  padding: 56px 20px 20px;
}
.page-header h1 {
  font-family: 'Playfair Display', serif;
  font-size: 28px;
  font-weight: 700;
  color: var(--text-on-dark);
  line-height: 1.2;
}
.page-header p {
  font-size: 13px;
  color: var(--text-on-dark-muted);
  margin-top: 4px;
}

.section-label {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--text-on-dark-muted);
  padding: 0 20px;
  margin-bottom: 12px;
}

/* ── Stat pills ─────────────────────────────────────────── */
.stat-row {
  display: flex;
  gap: 10px;
  padding: 0 20px;
  margin-bottom: 28px;
}
.stat-pill {
  flex: 1;
  background: var(--navy-light);
  border-radius: var(--radius-md);
  padding: 14px 12px;
  text-align: center;
}
.stat-pill__value {
  font-family: 'Playfair Display', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--amber);
  line-height: 1;
}
.stat-pill__label {
  font-size: 11px;
  color: var(--text-on-dark-muted);
  margin-top: 4px;
}

/* ── Activity feed ──────────────────────────────────────── */
.activity-list {
  display: flex;
  flex-direction: column;
  gap: 10px;
  padding: 0 20px;
}
.activity-item {
  background: var(--navy-light);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.activity-item:hover { background: var(--navy-mid); }
.activity-item__cover {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-sm);
  background: var(--navy-mid);
  flex-shrink: 0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 22px;
}
.activity-item__cover img { width: 100%; height: 100%; object-fit: cover; }
.activity-item__body { flex: 1; min-width: 0; }
.activity-item__game {
  font-family: 'Playfair Display', serif;
  font-size: 15px;
  font-weight: 600;
  color: var(--text-on-dark);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.activity-item__detail { font-size: 12px; color: var(--text-on-dark-muted); margin-top: 2px; }
.activity-item__winner { font-size: 12px; color: var(--amber); font-weight: 500; margin-top: 2px; }

/* ── Games grid ─────────────────────────────────────────── */
.games-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 12px;
  padding: 0 20px;
}
.game-card {
  border-radius: var(--radius-md);
  overflow: hidden;
  background: var(--navy-light);
  cursor: pointer;
  transition: transform 0.15s;
  position: relative;
}
.game-card:active { transform: scale(0.97); }
.game-card__cover {
  width: 100%;
  aspect-ratio: 1;
  background: var(--navy-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
  overflow: hidden;
}
.game-card__cover img { width: 100%; height: 100%; object-fit: cover; }
.game-card__info { padding: 10px 12px 12px; }
.game-card__title {
  font-family: 'Playfair Display', serif;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-on-dark);
  line-height: 1.3;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.game-card__meta { font-size: 11px; color: var(--text-on-dark-muted); margin-top: 2px; }
.game-card__plays-badge {
  position: absolute;
  top: 8px;
  right: 8px;
  background: rgba(26,31,54,0.85);
  backdrop-filter: blur(4px);
  border-radius: 20px;
  padding: 3px 8px;
  font-size: 11px;
  font-weight: 600;
  color: var(--amber);
}

/* ── Players ────────────────────────────────────────────── */
.player-list { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
.player-chip {
  background: var(--navy-light);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
  cursor: pointer;
  transition: background 0.15s;
}
.player-chip:hover { background: var(--navy-mid); }
.player-chip__avatar {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--navy-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
  border: 2px solid transparent;
}
.player-chip__avatar--admin { border-color: var(--amber); }
.player-chip__name { font-weight: 600; font-size: 15px; color: var(--text-on-dark); }
.player-chip__stats { font-size: 12px; color: var(--text-on-dark-muted); margin-top: 2px; }
.player-chip__arrow { margin-left: auto; color: var(--text-on-dark-muted); }

/* ── Buttons ────────────────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 12px 20px;
  border-radius: var(--radius-sm);
  font-size: 14px;
  font-weight: 600;
  transition: all 0.15s;
}
.btn--primary { background: var(--amber); color: var(--navy); }
.btn--primary:hover { background: var(--amber-dim); }
.btn--ghost { border: 1px solid rgba(255,255,255,0.15); color: var(--text-on-dark); }
.btn--ghost:hover { background: var(--navy-light); }
.btn--danger { background: var(--red); color: #fff; }
.btn--full { width: 100%; }

.add-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 20px;
  background: var(--navy-light);
  border-radius: var(--radius-md);
  color: var(--text-on-dark-muted);
  font-size: 14px;
  font-weight: 500;
  width: calc(100% - 40px);
  margin: 16px 20px 0;
  transition: background 0.15s;
}
.add-btn:hover { background: var(--navy-mid); color: var(--amber); }
.add-btn svg { width: 20px; height: 20px; }

/* ── Tonight ────────────────────────────────────────────── */
.tonight-filters { padding: 0 20px; display: flex; flex-direction: column; gap: 12px; margin-bottom: 24px; }
.filter-group label { font-size: 12px; font-weight: 500; color: var(--text-on-dark-muted); display: block; margin-bottom: 6px; }
.filter-group select {
  width: 100%;
  padding: 10px 14px;
  background: var(--navy-light);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  color: var(--text-on-dark);
  font-size: 14px;
  appearance: none;
}
.suggestion-card {
  margin: 0 20px 12px;
  background: var(--navy-light);
  border-radius: var(--radius-md);
  overflow: hidden;
  display: flex;
  cursor: pointer;
  transition: background 0.15s;
}
.suggestion-card:hover { background: var(--navy-mid); }
.suggestion-card__cover {
  width: 80px;
  flex-shrink: 0;
  background: var(--navy-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  overflow: hidden;
}
.suggestion-card__cover img { width: 100%; height: 100%; object-fit: cover; }
.suggestion-card__body { padding: 14px 16px; flex: 1; }
.suggestion-card__title { font-family: 'Playfair Display', serif; font-size: 16px; font-weight: 600; color: var(--text-on-dark); }
.suggestion-card__meta { font-size: 12px; color: var(--text-on-dark-muted); margin-top: 4px; }
.suggestion-card__tag {
  display: inline-block;
  margin-top: 8px;
  padding: 3px 8px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
  background: rgba(232,168,56,0.15);
  color: var(--amber);
}

/* ── Modals ─────────────────────────────────────────────── */
.modal-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10,12,26,0.85);
  z-index: 200;
  backdrop-filter: blur(3px);
}
.modal-overlay.hidden { display: none; }
.modal {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 480px;
  background: var(--navy-light);
  border-radius: var(--radius-lg) var(--radius-lg) 0 0;
  z-index: 210;
  max-height: 92dvh;
  overflow-y: auto;
  padding: 24px 20px calc(32px + var(--safe-bottom));
}
.modal.hidden { display: none; }
.modal__handle {
  width: 36px;
  height: 4px;
  background: rgba(255,255,255,0.2);
  border-radius: 2px;
  margin: 0 auto 20px;
}
.modal__title {
  font-family: 'Playfair Display', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--text-on-dark);
  margin-bottom: 20px;
}
.modal__close {
  position: absolute;
  top: 20px;
  right: 20px;
  color: var(--text-on-dark-muted);
  padding: 4px;
}
.modal__close svg { width: 22px; height: 22px; }

/* ── Forms ──────────────────────────────────────────────── */
.form-group { margin-bottom: 16px; }
.form-group label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-on-dark-muted);
  margin-bottom: 6px;
  letter-spacing: 0.05em;
  text-transform: uppercase;
}
.form-group input,
.form-group select,
.form-group textarea {
  width: 100%;
  padding: 12px 14px;
  background: var(--navy-mid);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  color: var(--text-on-dark);
  font-size: 15px;
  outline: none;
  transition: border-color 0.15s;
}
.form-group input:focus,
.form-group select:focus { border-color: var(--amber); }
.form-group input::placeholder { color: var(--text-on-dark-muted); }
.form-group select { appearance: none; }

.bgg-results { background: var(--navy-mid); border-radius: var(--radius-sm); overflow: hidden; margin-top: 4px; }
.bgg-result-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  cursor: pointer;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  transition: background 0.1s;
}
.bgg-result-item:last-child { border-bottom: none; }
.bgg-result-item:hover { background: rgba(255,255,255,0.05); }
.bgg-result-item__name { font-size: 14px; font-weight: 500; color: var(--text-on-dark); }
.bgg-result-item__year { font-size: 12px; color: var(--text-on-dark-muted); }

/* ── Player toggles ─────────────────────────────────────── */
.player-select-grid { display: flex; flex-wrap: wrap; gap: 8px; }
.player-toggle {
  padding: 8px 14px;
  border-radius: 20px;
  border: 1px solid rgba(255,255,255,0.15);
  color: var(--text-on-dark-muted);
  font-size: 13px;
  font-weight: 500;
  transition: all 0.15s;
  display: flex;
  align-items: center;
  gap: 6px;
}
.player-toggle.selected {
  background: rgba(232,168,56,0.15);
  border-color: var(--amber);
  color: var(--amber);
}

/* ── Achievements ───────────────────────────────────────── */
.achievement-list { display: flex; flex-direction: column; gap: 10px; padding: 0 20px; }
.achievement-item {
  background: var(--navy-light);
  border-radius: var(--radius-md);
  padding: 14px 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.achievement-item__icon {
  width: 44px;
  height: 44px;
  border-radius: 50%;
  background: var(--navy-mid);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 20px;
  flex-shrink: 0;
}
.achievement-item--earned .achievement-item__icon { background: rgba(232,168,56,0.15); }
.achievement-item__title { font-weight: 600; font-size: 14px; color: var(--text-on-dark); }
.achievement-item--locked .achievement-item__title { color: var(--text-on-dark-muted); }
.achievement-item__desc { font-size: 12px; color: var(--text-on-dark-muted); margin-top: 2px; }

/* ── Win rate bars ──────────────────────────────────────── */
.win-rate-bar { margin-bottom: 12px; }
.win-rate-bar__header { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-on-dark); margin-bottom: 6px; }
.win-rate-bar__pct { font-weight: 600; color: var(--amber); }
.win-rate-bar__track { height: 6px; background: var(--navy-mid); border-radius: 3px; overflow: hidden; }
.win-rate-bar__fill { height: 100%; background: var(--amber); border-radius: 3px; transition: width 0.6s ease; }

/* ── Complexity dots ────────────────────────────────────── */
.complexity-dots { display: flex; gap: 3px; }
.complexity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--navy-mid); }
.complexity-dot.filled { background: var(--amber); }

/* ── Empty state ────────────────────────────────────────── */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 48px 20px;
  text-align: center;
  gap: 12px;
}
.empty-state__icon { font-size: 48px; }
.empty-state__title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 600; color: var(--text-on-dark); }
.empty-state__body { font-size: 14px; color: var(--text-on-dark-muted); line-height: 1.6; }

.divider { height: 1px; background: rgba(255,255,255,0.07); margin: 24px 20px; }
.text-amber { color: var(--amber); }
.text-muted { color: var(--text-on-dark-muted); }
</style>
</head>
<body>
<div id="app">
  <div id="view-home" class="view active"></div>
  <div id="view-games" class="view"></div>
  <div id="view-players" class="view"></div>
  <div id="view-tonight" class="view"></div>

  <div id="modal-overlay" class="modal-overlay hidden"></div>
  <div id="modal-game-detail" class="modal hidden"></div>
  <div id="modal-player-detail" class="modal hidden"></div>
  <div id="modal-add-game" class="modal hidden"></div>
  <div id="modal-add-player" class="modal hidden"></div>
  <div id="modal-log-play" class="modal hidden"></div>

  <nav class="bottom-nav">
    <button class="nav-btn active" data-view="home">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      <span>Home</span>
    </button>
    <button class="nav-btn" data-view="games">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><path d="M8 21h8M12 17v4"/></svg>
      <span>Games</span>
    </button>
    <button class="nav-btn nav-btn--log" id="btn-log">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="16"/><line x1="8" y1="12" x2="16" y2="12"/></svg>
    </button>
    <button class="nav-btn" data-view="players">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75"/></svg>
      <span>Players</span>
    </button>
    <button class="nav-btn" data-view="tonight">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12,2 15.09,8.26 22,9.27 17,14.14 18.18,21.02 12,17.77 5.82,21.02 7,14.14 2,9.27 8.91,8.26"/></svg>
      <span>Tonight</span>
    </button>
  </nav>
</div>

<script>
// ── db.js ────────────────────────────────────────────────
const KEYS = { GAMES:'tt_games', PLAYERS:'tt_players', SESSIONS:'tt_sessions', ACHIEVEMENTS:'tt_achievements' };
function load(key) { try { return JSON.parse(localStorage.getItem(key)) || []; } catch { return []; } }
function save(key, data) { localStorage.setItem(key, JSON.stringify(data)); }
function uuid() { return crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2) + Date.now().toString(36); }

const db = {
  getGames() { return load(KEYS.GAMES); },
  getGame(id) { return this.getGames().find(g => g.id === id) || null; },
  addGame(game) { const games = this.getGames(); const n = { ...game, id: uuid(), addedAt: new Date().toISOString() }; games.push(n); save(KEYS.GAMES, games); return n; },
  updateGame(id, changes) { save(KEYS.GAMES, this.getGames().map(g => g.id === id ? { ...g, ...changes } : g)); },
  deleteGame(id) { save(KEYS.GAMES, this.getGames().filter(g => g.id !== id)); save(KEYS.SESSIONS, this.getSessions().filter(s => s.gameId !== id)); },

  getPlayers() { return load(KEYS.PLAYERS); },
  getPlayer(id) { return this.getPlayers().find(p => p.id === id) || null; },
  addPlayer(player) { const players = this.getPlayers(); const n = { ...player, id: uuid(), addedAt: new Date().toISOString() }; players.push(n); save(KEYS.PLAYERS, players); return n; },
  deletePlayer(id) { save(KEYS.PLAYERS, this.getPlayers().filter(p => p.id !== id)); },

  getSessions() { return load(KEYS.SESSIONS); },
  getSessionsForGame(gameId) { return this.getSessions().filter(s => s.gameId === gameId); },
  getSessionsForPlayer(playerId) { return this.getSessions().filter(s => s.players.includes(playerId)); },
  addSession(session) { const sessions = this.getSessions(); const n = { ...session, id: uuid(), loggedAt: new Date().toISOString() }; sessions.push(n); save(KEYS.SESSIONS, sessions); return n; },
  deleteSession(id) { save(KEYS.SESSIONS, this.getSessions().filter(s => s.id !== id)); },

  getAchievements() { return load(KEYS.ACHIEVEMENTS); },
  saveAchievements(a) { save(KEYS.ACHIEVEMENTS, a); },

  getWinRate(playerId, gameId = null) {
    let sessions = this.getSessionsForPlayer(playerId);
    if (gameId) sessions = sessions.filter(s => s.gameId === gameId);
    if (!sessions.length) return null;
    const wins = sessions.filter(s => s.winners.includes(playerId)).length;
    return { wins, plays: sessions.length, rate: Math.round((wins / sessions.length) * 100) };
  },
  getGameHealth(gameId) {
    const sessions = this.getSessionsForGame(gameId);
    if (!sessions.length) return { plays: 0, lastPlayed: null };
    const sorted = [...sessions].sort((a, b) => new Date(b.date) - new Date(a.date));
    return { plays: sessions.length, lastPlayed: sorted[0].date };
  },
  getRecentSessions(limit = 10) {
    return [...this.getSessions()].sort((a, b) => new Date(b.date) - new Date(a.date)).slice(0, limit);
  },
  getGamesForTonight(playerCount, maxComplexity) {
    return this.getGames().filter(g => {
      const countOk = g.minPlayers <= playerCount && g.maxPlayers >= playerCount;
      const complexOk = maxComplexity === 'any' || g.complexity <= parseFloat(maxComplexity);
      return countOk && complexOk;
    });
  },
};

// ── bgg.js ───────────────────────────────────────────────
const BGG_PROXY = 'https://api.allorigins.win/raw?url=';
const BGG_BASE  = 'https://boardgamegeek.com/xmlapi2';
const bgg = {
  async search(query) {
    const url = `${BGG_BASE}/search?query=${encodeURIComponent(query)}&type=boardgame`;
    try {
      const res = await fetch(`${BGG_PROXY}${encodeURIComponent(url)}`);
      const text = await res.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      return [...xml.querySelectorAll('item')].slice(0, 8).map(item => ({
        bggId: item.getAttribute('id'),
        title: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown',
        year: item.querySelector('yearpublished')?.getAttribute('value') || '',
      }));
    } catch { return []; }
  },
  async getGame(bggId) {
    const url = `${BGG_BASE}/thing?id=${bggId}&stats=1`;
    try {
      const res = await fetch(`${BGG_PROXY}${encodeURIComponent(url)}`);
      const text = await res.text();
      const xml = new DOMParser().parseFromString(text, 'text/xml');
      const item = xml.querySelector('item');
      if (!item) return null;
      return {
        bggId,
        title: item.querySelector('name[type="primary"]')?.getAttribute('value') || 'Unknown',
        year: item.querySelector('yearpublished')?.getAttribute('value') || '',
        thumbUrl: item.querySelector('thumbnail')?.textContent?.trim() || '',
        coverUrl: item.querySelector('image')?.textContent?.trim() || '',
        minPlayers: parseInt(item.querySelector('minplayers')?.getAttribute('value')) || 1,
        maxPlayers: parseInt(item.querySelector('maxplayers')?.getAttribute('value')) || 4,
        complexity: Math.round((parseFloat(item.querySelector('averageweight')?.getAttribute('value')) || 2.5) * 10) / 10,
      };
    } catch { return null; }
  },
};

  { id:'COOP_CHAMP', title:'Co-op Champion', desc:'Win 5 co-op sessions', icon:'🤝',
    check: (pid, s) => s.filter(x=>x.isCoop&&x.players.includes(pid)&&x.winners.includes(pid)).length>=5 },
  { id:'MARATHON', title:'Marathon', desc:'Play a session lasting over 3 hours', icon:'⏱️',

const achievements = {
  getForPlayer(playerId) {
    const sessions = db.getSessions();
    const earned = new Set(db.getAchievements().filter(a=>a.playerId===playerId).map(a=>a.type));
    return ACHIEVEMENT_DEFS.map(def => ({
      ...def,
      earned: earned.has(def.id),
      earnedAt: db.getAchievements().find(a=>a.playerId===playerId&&a.type===def.id)?.earnedAt||null,
    }));
  },
  recalculate() {
    const sessions = db.getSessions();
    const existing = db.getAchievements();
    const newOnes = [];
    for (const player of db.getPlayers()) {
      for (const def of ACHIEVEMENT_DEFS) {
        if (!existing.some(a=>a.playerId===player.id&&a.type===def.id) && def.check(player.id, sessions)) {
          newOnes.push({ id: uuid(), playerId: player.id, type: def.id, earnedAt: new Date().toISOString() });
        }
      }
    }
    if (newOnes.length) db.saveAchievements([...existing, ...newOnes]);
    return newOnes;
  },
};

// ── Helpers ──────────────────────────────────────────────
function complexityLabel(c) {
  if (c <= 1.5) return 'Light';
  if (c <= 2.5) return 'Medium-light';
  if (c <= 3.5) return 'Medium';
  if (c <= 4.5) return 'Heavy';
  return 'Expert';
}
function complexityDots(complexity) {
  const filled = Math.round(complexity);
  return Array.from({length:5},(_,i)=>`<div class="complexity-dot ${i<filled?'filled':''}"></div>`).join('');
}
function coverHTML(game, size='thumb') {
  const url = size==='full' ? game.coverUrl : game.thumbUrl;
  return url ? `<img src="${url}" alt="${game.title}" />` : `<span style="font-size:${size==='full'?'64':'36'}px">${game.coverEmoji||'🎲'}</span>`;
}
function formatDate(iso) {
  const d = new Date(iso);
  const diff = Math.floor((Date.now()-d)/86400000);
  if (diff===0) return 'Today';
  if (diff===1) return 'Yesterday';
  if (diff<7) return `${diff} days ago`;
  return d.toLocaleDateString('sv-SE',{month:'short',day:'numeric'});
}

function filterTonight() {
  const playerCount = parseInt(document.getElementById('filter-players')?.value||2);
  const maxComplexity = document.getElementById('filter-complexity')?.value||'any';
  const games = db.getGamesForTonight(playerCount, maxComplexity);
  const container = document.getElementById('tonight-results');
  if (!container) return;
  if (!games.length) {
    container.innerHTML = `<div class="empty-state"><div class="empty-state__icon">🤔</div><div class="empty-state__title">No matches</div><div class="empty-state__body">Try adjusting the filters, or add more games.</div></div>`;
    return;
  }
  const withHealth = games.map(g=>({...g,health:db.getGameHealth(g.id)}));
  withHealth.sort((a,b)=>{
    if(!a.health.lastPlayed&&!b.health.lastPlayed) return 0;
    if(!a.health.lastPlayed) return -1;
    if(!b.health.lastPlayed) return 1;
    return new Date(a.health.lastPlayed)-new Date(b.health.lastPlayed);
  });
  container.innerHTML = withHealth.map(g=>{
    const tag = !g.health.lastPlayed ? 'Never played' : `Last played ${new Date(g.health.lastPlayed).toLocaleDateString('sv-SE',{month:'short',day:'numeric'})}`;
    return `
      <div class="suggestion-card" onclick="openGameDetail('${g.id}')">
        <div class="suggestion-card__cover">${coverHTML(g)}</div>
        <div class="suggestion-card__body">

          <div class="suggestion-card__meta">${g.minPlayers}–${g.maxPlayers} players · ${complexityLabel(g.complexity)}</div>
          <div class="suggestion-card__tag">${tag}</div>
        </div>
      </div>`;
  }).join('');
}

      <div class="stat-pill"><div class="stat-pill__value">${overall?overall.wins:0}</div><div class="stat-pill__label">Wins</div></div>
      <div class="stat-pill"><div class="stat-pill__value">${overall?overall.rate+'%':'–'}</div><div class="stat-pill__label">Win rate</div></div>
      <div class="stat-pill"><div class="stat-pill__value">${earnedCount}</div><div class="stat-pill__label">Achievements</div></div>
    </div>
    <div class="section-label" style="padding:0;margin-bottom:12px">By game</div>
    <div style="margin-bottom:24px">${gameStatsHTML}</div>
    <div class="section-label" style="padding:0;margin-bottom:12px">Achievements</div>
    <div class="achievement-list" style="padding:0">${achievementsHTML}</div>`;
  openModal('modal-player-detail');
}

// Add game modal
let bggSearchTimeout = null;
let selectedBggGame = null;
let expansionCount = 0;

function openAddGame() {
  selectedBggGame = null;
  expansionCount = 0;
  const modal = document.getElementById('modal-add-game');
  modal.innerHTML = `
    <div class="modal__handle"></div>
    <button class="modal__close" onclick="closeModal('modal-add-game')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal__title">Add a game</div>
    <div class="form-group">
      <label>Search BoardGameGeek</label>
      <input type="text" id="bgg-search-input" placeholder="e.g. Spirit Island" oninput="onBggSearch(this.value)" autocomplete="off" />
      <div id="bgg-search-results" class="bgg-results" style="display:none"></div>
    </div>
    <div id="selected-game-preview" style="display:none;margin-bottom:16px;background:var(--navy-mid);border-radius:var(--radius-sm);padding:12px 14px">
      <div style="font-size:13px;color:var(--amber);font-weight:600;margin-bottom:4px">Selected</div>
      <div id="selected-game-name" style="font-size:15px;font-weight:600;color:var(--text-on-dark)"></div>
      <div id="selected-game-meta" style="font-size:12px;color:var(--text-on-dark-muted);margin-top:2px"></div>
    </div>
    <div class="form-group">
      <label>Or enter manually</label>
      <input type="text" id="manual-game-title" placeholder="Game title" />
    </div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
      <div class="form-group"><label>Min players</label><input type="number" id="game-min-players" value="2" min="1" max="20" /></div>
      <div class="form-group"><label>Max players</label><input type="number" id="game-max-players" value="4" min="1" max="20" /></div>
    </div>
    <div class="form-group"><label>Complexity (1–5)</label><input type="number" id="game-complexity" value="2.5" min="1" max="5" step="0.5" /></div>
    <div class="form-group">
      <label>Game type</label>
      <select id="game-coop">
        <option value="false">Competitive</option>
        <option value="true">Co-op</option>
      </select>
    </div>
    <div class="form-group"><label>Cover emoji (fallback)</label><input type="text" id="game-emoji" placeholder="🎲" maxlength="2" /></div>
    <div style="margin-bottom:8px">
      <div class="section-label" style="padding:0;margin-bottom:8px">Expansions</div>
      <div id="expansion-list"></div>
      <button type="button" onclick="addExpansionField()" style="font-size:13px;color:var(--amber);padding:8px 0">+ Add expansion</button>
    </div>
    <div style="margin-top:20px">
      <button class="btn btn--primary btn--full" onclick="saveGame()">Add to collection</button>
    </div>`;
  openModal('modal-add-game');
}

function onBggSearch(query) {
  clearTimeout(bggSearchTimeout);
  if (query.length < 2) { document.getElementById('bgg-search-results').style.display='none'; return; }
  bggSearchTimeout = setTimeout(async () => {
    const results = await bgg.search(query);
    const container = document.getElementById('bgg-search-results');
    if (!results.length) { container.style.display='none'; return; }
    container.innerHTML = results.map(r=>`
      <div class="bgg-result-item" onclick="selectBggGame('${r.bggId}','${r.title.replace(/'/g,"\\'")}','${r.year}')">
        <div><div class="bgg-result-item__name">${r.title}</div><div class="bgg-result-item__year">${r.year}</div></div>
      </div>`).join('');
    container.style.display = 'block';
  }, 400);
}

async function selectBggGame(bggId, title, year) {
  document.getElementById('bgg-search-results').style.display = 'none';
  document.getElementById('bgg-search-input').value = title;
  const preview = document.getElementById('selected-game-preview');
  document.getElementById('selected-game-name').textContent = title;
  document.getElementById('selected-game-meta').textContent = 'Fetching details…';
  preview.style.display = 'block';
  const data = await bgg.getGame(bggId);
  if (data) {
    selectedBggGame = data;
    document.getElementById('manual-game-title').value = data.title;
    document.getElementById('game-min-players').value = data.minPlayers;
    document.getElementById('game-max-players').value = data.maxPlayers;
    document.getElementById('game-complexity').value = data.complexity;
    document.getElementById('selected-game-meta').textContent = `${data.minPlayers}–${data.maxPlayers} players · Complexity ${data.complexity} · ${year}`;
  } else {
    document.getElementById('selected-game-meta').textContent = 'Could not fetch details — fill in manually.';
  }
}

function addExpansionField() {
  const id = ++expansionCount;
  const list = document.getElementById('expansion-list');
  const div = document.createElement('div');
  div.style.cssText = 'display:flex;gap:8px;align-items:center;margin-bottom:8px';
  div.innerHTML = `
    <input type="text" placeholder="Expansion name" id="exp-title-${id}" style="flex:1;padding:10px 14px;background:var(--navy-mid);border:1px solid rgba(255,255,255,0.1);border-radius:var(--radius-sm);color:var(--text-on-dark);font-size:14px;outline:none" />
    <label style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-on-dark-muted);white-space:nowrap"><input type="checkbox" id="exp-owned-${id}" checked /> Owned</label>
    <button onclick="this.parentNode.remove()" style="color:var(--red);font-size:18px;padding:4px">×</button>`;
  list.appendChild(div);
}

function saveGame() {
  const title = document.getElementById('manual-game-title')?.value?.trim() || selectedBggGame?.title;
  if (!title) { alert('Please enter a game title.'); return; }
  const expansions = [];
  document.querySelectorAll('[id^="exp-title-"]').forEach(input => {
    const num = input.id.split('-').pop();
    const expTitle = input.value.trim();
    if (expTitle) expansions.push({ id: uuid(), title: expTitle, owned: document.getElementById(`exp-owned-${num}`)?.checked ?? true });
  });
  db.addGame({
    title,
    bggId: selectedBggGame?.bggId || null,
    coverUrl: selectedBggGame?.coverUrl || '',
    thumbUrl: selectedBggGame?.thumbUrl || '',
    minPlayers: parseInt(document.getElementById('game-min-players').value) || 2,
    maxPlayers: parseInt(document.getElementById('game-max-players').value) || 4,
    complexity: parseFloat(document.getElementById('game-complexity').value) || 2.5,
    isCoop: document.getElementById('game-coop').value === 'true',
    coverEmoji: document.getElementById('game-emoji').value || '🎲',
    expansions,
  });
  closeModal('modal-add-game');
  renderAll();
}

// Add player modal
const EMOJIS = ['🧙','🧝','🧌','🧟','🏴‍☠️','🤠','👾','🦊','🐉','🌙','⚡','🎩','🦁','🐺','🦅'];

function openAddPlayer() {
  const modal = document.getElementById('modal-add-player');
  const isFirst = db.getPlayers().length === 0;
  modal.innerHTML = `
    <div class="modal__handle"></div>
    <button class="modal__close" onclick="closeModal('modal-add-player')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal__title">Add a player</div>
    <div class="form-group"><label>Name</label><input type="text" id="player-name" placeholder="e.g. Sebastian" autocomplete="off" /></div>
    <div class="form-group">
      <label>Avatar</label>
      <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px" id="emoji-picker">
        ${EMOJIS.map(e=>`<button type="button" onclick="selectEmoji('${e}')" id="emoji-btn-${e}" style="font-size:24px;width:44px;height:44px;border-radius:var(--radius-sm);background:var(--navy-mid);border:2px solid transparent;transition:all 0.1s">${e}</button>`).join('')}
      </div>
      <input type="hidden" id="player-avatar" value="${EMOJIS[0]}" />
    </div>
    ${isFirst?`<div style="background:rgba(232,168,56,0.1);border:1px solid rgba(232,168,56,0.3);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:16px"><div style="font-size:13px;color:var(--amber);font-weight:600">First player = admin</div><div style="font-size:12px;color:var(--text-on-dark-muted);margin-top:4px">The first player added gets admin rights to log sessions and manage the collection.</div></div>`:''}
    <button class="btn btn--primary btn--full" onclick="savePlayer()">Add player</button>`;
  setTimeout(() => selectEmoji(EMOJIS[0]), 0);
  openModal('modal-add-player');
}

function selectEmoji(emoji) {
  EMOJIS.forEach(e => { const btn=document.getElementById(`emoji-btn-${e}`); if(btn) btn.style.borderColor='transparent'; });
  const sel = document.getElementById(`emoji-btn-${emoji}`);
  if (sel) sel.style.borderColor = 'var(--amber)';
  const input = document.getElementById('player-avatar');
  if (input) input.value = emoji;
}

function savePlayer() {
  const name = document.getElementById('player-name')?.value?.trim();
  if (!name) { alert('Please enter a name.'); return; }
  const avatar = document.getElementById('player-avatar')?.value || '🧙';
  const isFirst = db.getPlayers().length === 0;
  db.addPlayer({ name, avatar, isAdmin: isFirst });
  closeModal('modal-add-player');
  renderAll();
}

// Log play modal
let logSelectedPlayers = new Set();
let logSelectedWinners = new Set();

function openLogPlay(preselectedGameId = null) {
  logSelectedPlayers = new Set();
  logSelectedWinners = new Set();
  const games = db.getGames();
  const players = db.getPlayers();
  if (!games.length) { alert('Add a game first before logging a session.'); return; }
  if (!players.length) { alert('Add some players first before logging a session.'); return; }
  const modal = document.getElementById('modal-log-play');
  const today = new Date().toISOString().split('T')[0];
  modal.innerHTML = `
    <div class="modal__handle"></div>
    <button class="modal__close" onclick="closeModal('modal-log-play')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <div class="modal__title">Log a session</div>
    <div class="form-group">
      <label>Game</label>
      <select id="log-game" onchange="renderWinnerPicker()">
        ${games.map(g=>`<option value="${g.id}" ${g.id===preselectedGameId?'selected':''}>${g.title}</option>`).join('')}
      </select>
    </div>
    <div class="form-group"><label>Date</label><input type="date" id="log-date" value="${today}" /></div>
    <div class="form-group"><label>Duration (minutes, optional)</label><input type="number" id="log-duration" placeholder="e.g. 90" min="1" /></div>
    <div class="form-group">
      <label>Who played?</label>
      <div class="player-select-grid" id="log-players">
        ${players.map(p=>`<button type="button" class="player-toggle" id="log-player-${p.id}" onclick="toggleLogPlayer('${p.id}')">${p.avatar} ${p.name}</button>`).join('')}
      </div>
    </div>
    <div class="form-group">
      <label id="log-winner-label">Who won?</label>
      <div class="player-select-grid" id="log-winners"><span style="font-size:13px;color:var(--text-on-dark-muted)">Select players above first</span></div>
    </div>
    <div class="form-group"><label>Notes (optional)</label><input type="text" id="log-notes" placeholder="e.g. Used the promo card, first play" /></div>
    <button class="btn btn--primary btn--full" onclick="saveSession()">Save session</button>`;
  openModal('modal-log-play');
}

function toggleLogPlayer(playerId) {
  const btn = document.getElementById(`log-player-${playerId}`);
  if (logSelectedPlayers.has(playerId)) {
    logSelectedPlayers.delete(playerId);
    logSelectedWinners.delete(playerId);
    btn?.classList.remove('selected');
  } else {
    logSelectedPlayers.add(playerId);
    btn?.classList.add('selected');
  }
  renderWinnerPicker();
}

function toggleLogWinner(playerId) {
  const game = db.getGame(document.getElementById('log-game')?.value);
  if (!game?.isCoop) { logSelectedWinners.clear(); logSelectedWinners.add(playerId); }
  else { if(logSelectedWinners.has(playerId)) logSelectedWinners.delete(playerId); else logSelectedWinners.add(playerId); }
  renderWinnerPicker();
}

function renderWinnerPicker() {
  const container = document.getElementById('log-winners');
  const label = document.getElementById('log-winner-label');
  const game = db.getGame(document.getElementById('log-game')?.value);
  const isCoop = game?.isCoop || false;
  if (!container) return;
  if (!logSelectedPlayers.size) {
    container.innerHTML = '<span style="font-size:13px;color:var(--text-on-dark-muted)">Select players above first</span>';
    return;
  }
  if (label) label.textContent = isCoop ? 'Did everyone win?' : 'Who won?';
  const players = db.getPlayers().filter(p => logSelectedPlayers.has(p.id));
  container.innerHTML = players.map(p=>`
    <button type="button" class="player-toggle ${logSelectedWinners.has(p.id)?'selected':''}" onclick="toggleLogWinner('${p.id}')">${p.avatar} ${p.name}</button>`).join('');
  if (isCoop) container.innerHTML += `<button type="button" class="player-toggle ${logSelectedWinners.size===0?'selected':''}" onclick="logSelectedWinners.clear();renderWinnerPicker()">💀 Loss</button>`;
}

function saveSession() {
  const gameId = document.getElementById('log-game')?.value;
  const date = document.getElementById('log-date')?.value;
  const duration = parseInt(document.getElementById('log-duration')?.value) || null;
  const notes = document.getElementById('log-notes')?.value?.trim() || '';
  const game = db.getGame(gameId);
  if (!gameId || !date) { alert('Please select a game and date.'); return; }
  if (!logSelectedPlayers.size) { alert('Select at least one player.'); return; }
  db.addSession({ gameId, date, durationMinutes: duration, isCoop: game?.isCoop||false, players:[...logSelectedPlayers], winners:[...logSelectedWinners], notes });
  achievements.recalculate();
  closeModal('modal-log-play');
  renderAll();
}

// ── Navigation & modal management ────────────────────────
function navigateTo(viewName) {
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.nav-btn[data-view]').forEach(b=>b.classList.remove('active'));
  const view = document.getElementById(`view-${viewName}`);
  const btn = document.querySelector(`.nav-btn[data-view="${viewName}"]`);
  if (view) view.classList.add('active');
  if (btn) btn.classList.add('active');
  const renderers = { home:renderHome, games:renderGames, players:renderPlayers, tonight:renderTonight };
  renderers[viewName]?.();
  window.scrollTo(0,0);
}

function renderAll() { renderCurrent(); }
function renderCurrent() {
  const active = document.querySelector('.view.active');
  if (!active) return;
  const name = active.id.replace('view-','');
  const renderers = { home:renderHome, games:renderGames, players:renderPlayers, tonight:renderTonight };
  renderers[name]?.();
}

function openModal(modalId) {
  document.getElementById('modal-overlay').classList.remove('hidden');
  document.getElementById(modalId).classList.remove('hidden');
  document.body.style.overflow = 'hidden';
}
function closeModal(modalId) {
  document.getElementById(modalId).classList.add('hidden');
  const anyOpen = [...document.querySelectorAll('.modal')].some(m=>!m.classList.contains('hidden'));
  if (!anyOpen) { document.getElementById('modal-overlay').classList.add('hidden'); document.body.style.overflow=''; }
}
function closeAllModals() {
  document.querySelectorAll('.modal').forEach(m=>m.classList.add('hidden'));
  document.getElementById('modal-overlay').classList.add('hidden');
  document.body.style.overflow = '';
}

// ── Boot ─────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
    btn.addEventListener('click', () => navigateTo(btn.dataset.view));
  });
  document.getElementById('btn-log').addEventListener('click', openLogPlay);
  document.getElementById('modal-overlay').addEventListener('click', closeAllModals);

  navigateTo('home');

  // Seed demo data once if empty
  if (!db.getPlayers().length && !db.getGames().length) seedDemoData();
});

function seedDemoData() {
  const p1 = db.addPlayer({ name:'Sebastian', avatar:'🧙', isAdmin:true });
  const p2 = db.addPlayer({ name:'Emelie', avatar:'🧝', isAdmin:false });
  const p3 = db.addPlayer({ name:'Johan', avatar:'🦊', isAdmin:false });
  const g1 = db.addGame({ title:'Spirit Island', bggId:'162886', thumbUrl:'', coverUrl:'', coverEmoji:'🌊', minPlayers:1, maxPlayers:4, complexity:4.0, isCoop:true, expansions:[{id:'e1',title:'Branch & Claw',owned:true},{id:'e2',title:'Jagged Earth',owned:true}] });
  const g2 = db.addGame({ title:'Root', bggId:'237182', thumbUrl:'', coverUrl:'', coverEmoji:'🦝', minPlayers:2, maxPlayers:4, complexity:3.7, isCoop:false, expansions:[] });
  const g3 = db.addGame({ title:'Wingspan', bggId:'266192', thumbUrl:'', coverUrl:'', coverEmoji:'🦜', minPlayers:1, maxPlayers:5, complexity:2.4, isCoop:false, expansions:[{id:'e3',title:'European Expansion',owned:false}] });
  const past = n => { const d=new Date(); d.setDate(d.getDate()-n); return d.toISOString().split('T')[0]; };
  db.addSession({ gameId:g1.id, date:past(2), durationMinutes:150, isCoop:true, players:[p1.id,p2.id,p3.id], winners:[p1.id,p2.id,p3.id], notes:'Beat invader deck on difficulty 4' });
  db.addSession({ gameId:g2.id, date:past(7), durationMinutes:90, isCoop:false, players:[p1.id,p2.id,p3.id], winners:[p2.id], notes:'' });
  db.addSession({ gameId:g3.id, date:past(14), durationMinutes:60, isCoop:false, players:[p1.id,p2.id], winners:[p1.id], notes:'' });
  db.addSession({ gameId:g2.id, date:past(21), durationMinutes:100, isCoop:false, players:[p1.id,p2.id,p3.id], winners:[p3.id], notes:'' });
  db.addSession({ gameId:g1.id, date:past(30), durationMinutes:180, isCoop:true, players:[p1.id,p2.id], winners:[], notes:'Lost on the last round' });
  achievements.recalculate();
}
</script>
